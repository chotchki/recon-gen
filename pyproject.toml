[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
# CY.1.fix1 (2026-06-10) — DROPPED ``backend-path = ["."]`` + the
# ``[tool.setuptools.cmdclass]`` block below. Per PEP 517,
# ``backend-path`` makes the front-end ONLY search those directories
# for the backend module — which hid ``setuptools.build_meta`` (in
# site-packages) from pyproject_hooks and broke the v13.13.0 build
# with ``BackendUnavailable: Cannot find module 'setuptools.build_meta'``.
# Replacement: ``.github/workflows/release.yml`` has a new step that
# writes ``src/recon_gen/_build_info.py`` BEFORE ``python -m build``
# runs, so the wheel still carries the baked git_sha + built_at +
# build_kind. Runtime fallback in ``_git_short_sha`` continues to
# cover ad-hoc dev builds.

[project]
name = "recon-gen"
dynamic = ["version"]
description = "Outside validation that your financial system is sound — tells midsize financial institutions whether their books balance day to day, and when they don't, where to look first. Ships self-hosted HTMX dashboards and a regulator-ready PDF audit from one L2 institution model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = [
    "self-hosted",
    "audit",
    "reconciliation",
    "analytics",
    "finance",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "graphviz>=0.20",
    # CA.1 — DuckDB is a core dialect (replaces SQLite as the in-process
    # backend for unit/Studio/integration paths). Not extras: every
    # `recon-gen` invocation imports `Dialect.DUCKDB` and the runner
    # spins one up for the local test path. Pure-Python wheel; install
    # cost minor. SQLite path stays alive through CA.8.
    "duckdb>=1.1",
]

[project.urls]
Homepage = "https://chotchki.github.io/recon-gen/"
Documentation = "https://chotchki.github.io/recon-gen/"
"API Reference" = "https://recon-gen.readthedocs.io/en/latest/"
Source = "https://github.com/chotchki/recon-gen"
Issues = "https://github.com/chotchki/recon-gen/issues"
Changelog = "https://github.com/chotchki/recon-gen/blob/main/RELEASE_NOTES.md"

[project.optional-dependencies]
# Phase BS.6 (2026-05-29) — collapsed 8 extras → 3: `prod` + `dev` +
# `e2e`. Pre-BS.6 the split was per-feature-dimension (deploy / demo
# / demo-oracle / audit / serve / docs); BS-arc operator-feedback was
# the granularity created confusion without proportional value
# (operators always wanted "production run" or "dev run" or "e2e run").
# Net effect: simpler install, one knob per persona. Specific dep
# annotations preserved in the prod-bucket below.
#
# DW.10 (Phase DW, v16) — QuickSight is GONE. The `[quicksight]` extra
# (boto3 + botocore[crt]) is deleted; there's no AWS SDK anywhere in the
# dependency graph. recon-gen ships two surfaces now: self-hosted App2
# + regulator-ready PDF. (QuickSight shipped through v15.x — pin
# `recon-gen==15.x` with that release's `[quicksight]` extra if you
# need it.)
prod = [
    # ETL Engineer / Integrator running a production App2 deploy gets
    # every runtime dep under one extras name (App2 + PDF + DB). Set
    # studio_enabled=false in cfg for dashboards-only prod App2; the
    # markdown dep stays installed but inert.
    #
    # App2 runtime — Starlette + uvicorn + multipart (HTMX form POST
    # parsing) + httpx (TestClient + outbound). The browser-side
    # JS/CSS ships inside the wheel — App2 needs no internet at
    # runtime (X.2.p). (was [serve])
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    # DD.1 (Phase DD) — OAuth/OIDC client for Studio + Dashboards
    # auth. authlib drives the issuer-discovery + token exchange +
    # ID token verify flow. PyJWT signs/verifies the session cookie
    # (HS256 over a cfg-supplied secret env var) — smaller surface
    # than authlib's JWT helpers + cleaner Starlette middleware fit.
    # Both pure-Python wheels; runtime cost minor.
    "authlib>=1.3",
    "pyjwt>=2.8",
    # DD.2 — itsdangerous backs Starlette's SessionMiddleware (signed
    # cookie storage). authlib's starlette_client.OAuth requires it to
    # park PKCE verifier + state across the login → callback redirect.
    "itsdangerous>=2.2",
    # PG driver — psycopg3 with [pool] for AsyncConnectionPool used
    # by the App2 server to bound DB concurrency. (was [demo])
    "psycopg[binary,pool]>=3.1",
    # Oracle driver — oracledb thin client (no Oracle Instant Client
    # install needed; thick mode kicks in if client libs present).
    # Pure PyPI wheel; install cost minor. (was [demo-oracle])
    # CA.13 — floor bumped from 2.0 to 3.4.0 to pull in
    # Connection.direct_path_load (added Oct 2025). The seed-apply
    # path auto-detects this method via hasattr; older installs fall
    # back to the INSERT-ALL coalescer at `batch_oracle_inserts`.
    # Bumping the floor on `[prod]` so any production install gets
    # the 96× faster seed apply by default.
    "oracledb>=3.4.0",
    # CA.11 — pyarrow for DuckDB bulk-load via pa.Table + con.register +
    # INSERT SELECT. Optional like oracledb: the apply path falls back to
    # the CA.10 multi-row VALUES text path when pyarrow isn't installed.
    # CA.12/CA.13 follow-ups will extend the same pyarrow pipe to PG
    # (adbc_ingest) and Oracle (direct_path_load) once those adapters land.
    "pyarrow>=14",
    # Markdown for the Studio editor's textarea Preview tab (BF.9 —
    # description fields opt-in via FieldSpec.preview_markdown).
    # Lazy-imported in `_studio_editor_routes.py`; inert when
    # studio_enabled=false. (was [serve])
    "markdown>=3.6",
    # XLSX export for dashboard tables (CH.5 / CH.4 operator addition,
    # 2026-06-08). Lazy-imported in `server.py::_emit_xlsx_response`;
    # only fires when an operator clicks a table's "↓ XLSX" button.
    "openpyxl>=3.1",
    # Audit PDF generation. reportlab is pure Python; pypdf used by
    # the end-to-end smoke test. pyHanko optional at runtime —
    # loaded only when cfg.signing is set; absent block = unsigned
    # PDF (back-compat). (was [audit])
    "reportlab>=4.0",
    "pypdf>=6.13.3",
    "pyhanko>=0.30",
    # Docs site build (was [docs] pre-BS.6, then briefly only in [dev]).
    # `recon-gen docs apply --portable` is a production CLI verb — users
    # following `pip install recon-gen[prod]` should get a working docs
    # build. mkdocs-macros for Jinja2 templating; mkdocs-click for
    # auto-generated CLI reference; graphviz Python wrapper for L2
    # topology + dataflow diagram construction.
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # mkdocstrings removed: API docs build at ReadTheDocs (Sphinx);
    # mkdocs is end-user / integrator only.
    "mkdocs-click>=0.8",
    "mkdocs-macros-plugin>=1.3",
    "graphviz>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # DS.3.7 — the sampled tail beyond the enumeration domains:
    # int64 magnitudes, cardinalities above domain bounds, the
    # random_l2_yaml topology axis. Runs DERANDOMIZED with the
    # example database disabled (tests/conftest.py registers the
    # profile) so a failing example reproduces bit-identically on
    # any machine — POLICY 1 by construction, no .hypothesis dir
    # divergence between local and CI.
    "hypothesis>=6.100",
    # The runner uses `pytest -n auto` on every layer. The app2 layer
    # additionally passes `--dist=loadgroup` (see
    # src/recon_gen/_dev/runner.py::_layer_command app2 branch) so the
    # BV.3.3 trainer dogfood module's `@pytest.mark.xdist_group(
    # "trainer-<dialect>")` pin actually funnels grouped tests to one
    # worker (xdist's default `--dist=load` silently ignores the mark).
    # xdist therefore belongs in [dev], not just [e2e] — `uv sync
    # --extra dev && pytest -n auto` should work.
    "pytest-xdist>=3.5",
    # CB.17.k — filelock for the xdist-canonical "session-scope-once"
    # pattern in `tests/conftest.py::pg_container_url` /
    # `oracle_container_url`. Without cross-worker file coordination,
    # each xdist worker spins its own copy of the container (16 PG
    # containers + 16 Oracle attempts per `pytest -n auto`); with the
    # filelock pattern, the first worker creates and the other workers
    # adopt. Also available transitively from pytest-xdist[testing] but
    # we make it explicit here for the conftest's direct use.
    "filelock>=3.13",
    # Y.7-followup — the runner's browser layer passes `--reruns 2` so a
    # genuinely-flaky live-cloud e2e (QS embed-render under -n 4 worker
    # contention occasionally drops a visual from the DOM at snapshot
    # time — passes on re-run) auto-retries before halting the chain. A
    # test that's broken (not flaky) fails 3× → still halts.
    "pytest-rerunfailures>=14.0",
    # DW.10 (Phase DW, v16) — `boto3-stubs` dropped: no boto3 left in src
    # for pyright to resolve (the last live boto3, config.py's QS-user-ARN
    # derive, went in DW.11). The `[quicksight]` extra that anchored it is
    # deleted.
    # Y.2.gate.b.2.impl — Docker-backed local DB containers.
    # PG (b.2.impl.schema) + Oracle (b.2.impl.oracle). Oracle's
    # container is multi-GB and slower to start (~20-30s on
    # gvenzl/oracle-free:23-faststart vs. ~10s on PG); operator
    # selects per `--variants=` arg, so a tight inner loop on local-pg
    # never pays the Oracle pull cost. SQLite intentionally absent:
    # it's a single-file DB, no testcontainer needed (b.2.impl.sqlite
    # spec).
    "testcontainers[postgres,oracle]>=3.7",
    "psycopg[binary,pool]>=3.1",
    # P.9d — oracledb thin client so the e2e harness can connect to
    # an Oracle dialect config without a separate `[demo-oracle]` install.
    "oracledb>=2.0",
    # Phase U — audit PDF generation; pulled into [dev] so tests/audit/
    # runs without a separate install step.
    "reportlab>=4.0",
    "pypdf>=6.13.3",
    "build>=1.0",
    "twine>=5.0",
    "pyright>=1.1.380",
    # NB: biome (the JS linter, gated alongside pyright in the pytest
    # sessionstart hook — conftest.py) is NOT pip-installable here yet. The
    # Biome project hasn't published an *official* PyPI package (in flight:
    # biomejs/biome#8818); the unofficial `biome-js` wrapper ships only a
    # `manylinux_2_28_x86_64` wheel (no macOS / arm64 / sdist) and is a
    # stale single release on Biome 2.3.x — adding it would break
    # `uv sync --extra dev` off linux-x86_64. So biome stays a system
    # binary — brew locally, `biomejs/setup-biome` in CI — and the conftest
    # gate skips cleanly when it isn't on PATH. **Revisit when biomejs/biome#8818
    # lands**: add the official package to `[dev]`, drop the `setup-biome` CI
    # step + the system-binary fallback comment in conftest / install.md.
    # v8.5.2 — pulled into [dev] so pyright (in the pytest sessionstart
    # gate) can resolve Playwright's PEP 561 inline stubs when type-
    # checking ``common/browser/helpers.py``. The Python package alone
    # is enough for stub resolution; ``playwright install`` (which
    # downloads browser binaries) is still only needed for the e2e
    # browser tests.
    "playwright>=1.60",
    # Phase X.2 spike — Starlette server + TestClient for HTML renderer
    # unit tests. Pulled into [dev] so the spike's tests run in the
    # default `uv sync --extra dev` developer setup without a separate
    # `--extra prod`.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    # starlette 1.3.x's TestClient prefers httpx2 (`import httpx2 as httpx`)
    # and warns + degrades types when only httpx is present. Pin it in the
    # test extras so the testclient backend is httpx2 (CVE-2026-54283 forced
    # the 1.3.1 bump). httpx (above) stays for App2's runtime outbound.
    "httpx2>=2.5.0",
    # BF.9 — markdown rendering for the Studio editor's textarea
    # Preview tab. Mirror of [serve] (also pinned there). v11.22.1
    # CI failure: adding to [serve] alone wasn't enough; the
    # unit-test CI job uses `uv sync --extra dev --extra audit`
    # (no `--extra prod`), so studio routes tests (which spin a
    # Starlette TestClient + hit the markdown-preview path) still
    # tripped ModuleNotFoundError. Pin here so [dev] is self-
    # sufficient for the test surface — matches the existing
    # starlette mirror pattern.
    "markdown>=3.6",
    # NOTE: mkdocs + mkdocs-* + graphviz moved to [prod] post-BS.6.
    # `docs apply` is a production CLI verb so users following
    # `pip install recon-gen[prod]` get a working docs build.
    # DC.2 — runner-internal ACME + Cloudflare DNS-01 coordinator.
    # Lives under `src/recon_gen/_dev/tls/` (excluded from the
    # published wheel). The `acme` lib is the IETF Let's Encrypt
    # maintainer-stewarded Python client; `cryptography` for keypair
    # + CSR + cert parsing; `dnspython` for TXT-propagation polling
    # against 1.1.1.1; `requests` for the Cloudflare REST surface +
    # the `cloudflare_trace` public-IP discovery. Pinned explicitly
    # here so `uv sync --extra dev` is self-sufficient — the audit
    # PDF's pyHanko/cryptography path and acme's dnspython hard dep
    # would drag most of these in transitively, but the explicit pin
    # doesn't rely on transitive bumps.
    "acme>=2.10.0",
    "cryptography>=48.0.1",
    "dnspython>=2.4",
    "requests>=2.31",
    # DD.4 — Dex (test-side OIDC IdP) needs a bcrypt-hashed user
    # password baked into its config. The runner generates the hash
    # at spinup via `bcrypt.hashpw(RECON_GEN_DEX_USER_PASSWORD,
    # bcrypt.gensalt())`. Test fixtures also import bcrypt to verify
    # the hash round-trip when asserting auth flows. Pure-Python wheel
    # with a tiny C extension; install cost minor.
    "bcrypt>=4.0",
]
e2e = [
    "pytest>=7.0",
    "pytest-xdist>=3.5",
    "playwright>=1.60",
    # X.2.u.3 — the browser e2e suite is now parametrized over
    # [qs, app2]: App2Driver serves the bundled HTMX renderer in-process
    # (common/html/server.py imports starlette). So the App2 server stack
    # is a hard dep of `pytest tests/e2e/ -m browser`
    # — keep this list in sync with [prod]. (Caught by the nightly
    # e2e-pg-browser cron: `uv sync --extra e2e` without these →
    # ModuleNotFoundError: No module named 'starlette' at collection.)
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    # starlette 1.3.x testclient backend (see [dev]); CVE-2026-54283.
    "httpx2>=2.5.0",
    # BF.9 — same mirror as [dev]; the e2e suite spins App2Driver
    # which hits the studio editor's markdown-preview route in some
    # cells. Keep in sync with [serve] + [dev].
    "markdown>=3.6",
]

[project.scripts]
recon-gen = "recon_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Y.2.gate.b.13 — _dev/ holds the test layer chain runner; importable from
# conftest + tests during dev / CI but excluded from the customer wheel.
# Wheel-build verification: see Y.2.gate.c (CI assertion that ``unzip -l``
# of the built wheel returns no _dev matches).
exclude = ["recon_gen._dev", "recon_gen._dev.*"]

[tool.setuptools.package-data]
recon_gen = [
    # PEP 561 marker — signals to downstream consumers (pyright /
    # mypy / pyre) that this package ships inline type hints they
    # should honor. Without the marker, type-checkers fall back to
    # treating every public API as `Any`, defeating the strict-typed
    # surface this codebase invests in. Empty file by convention; the
    # presence at the package root is the signal.
    "py.typed",
    "apps/l1_dashboard/_default_l2.yaml",
    # Bundled mkdocs config so ``docs apply`` works from an installed
    # wheel. Lives one level up from ``docs/`` (mkdocs rejects
    # ``docs_dir: .``).
    "mkdocs.yml",
    # Bundled L2 fixtures so ``docs apply`` from an installed wheel
    # can render without the operator's tests/l2/ checkout. Synced to
    # ``tests/l2/`` by ``tests/unit/test_l2_fixtures_sync.py``.
    "_l2_fixtures/*.yaml",
    "docs/**/*.md",
    "docs/**/*.svg",
    "docs/**/*.png",
    "docs/**/*.css",
    "docs/**/*.js",
    "docs/**/*.yaml",
    "docs/**/*.yml",
    # Phase O.1.c — hand-authored Graphviz diagrams.
    "docs/**/*.dot",
    # X.2 spike — built Tailwind CSS for the HTML renderer's
    # static page shell. ``output.css`` is the build artifact;
    # ``input.css`` is the @source-config source. Both shipped so
    # an installed wheel can serve the smoke runner without
    # forcing the user to run the Tailwind CLI.
    "common/html/assets/*.css",
    # X.2.a.1 — JS extracted to standalone .js files so biome can
    # lint / format / minify them. render.py loads at module-import
    # time; package_data ships them inside the wheel.
    "common/html/assets/js/*.js",
    # X.2.p — vendored third-party browser libs (htmx / d3 / d3-sankey /
    # tom-select / flatpickr / nouislider) the page shell loads from
    # ``/static/vendor/...`` instead of a CDN. Pre-built minified dist
    # files committed under ``assets/vendor/{js,css}/``; ``vendor.lock``
    # carries the provenance + sha256s. Shipped so a `pip install
    # recon-gen[serve]` App 2 works offline. Refresh recipe:
    # ``scripts/vendor_js_deps.py``.
    "common/html/assets/vendor/js/*.js",
    "common/html/assets/vendor/css/*.css",
    "common/html/assets/vendor/vendor.lock",
    # X.4.b/f/h — Studio chrome assets (diagram-svg.css for the SVG-only
    # cascades + diagram.js) the ``/studio/static`` mount serves.
    # Post-AM.4: only diagram-svg.css remains (editor.css / data.css
    # retired; diagram.css renamed). Glob still picks up the .css/.js.
    # Loaded at runtime via ``Path(__file__).parent / "_studio_assets"``;
    # without this glob the wheel ships an empty directory and the studio
    # 404s on its own CSS / JS.
    "common/html/_studio_assets/*.css",
    "common/html/_studio_assets/*.js",
]

[tool.setuptools.dynamic]
version = {attr = "recon_gen.__version__"}

# CY.1.fix1 (2026-06-10) — REMOVED ``[tool.setuptools.cmdclass]``
# block that pointed at ``build_hook.BuildPyWithBuildInfo``. The
# cmdclass needed ``backend-path = ["."]`` in [build-system] to be
# importable from the PEP-517 build env, but that ALSO hides
# ``setuptools.build_meta`` itself, breaking the build. Replaced by
# a CI-side step in ``.github/workflows/release.yml`` that writes
# ``src/recon_gen/_build_info.py`` before ``python -m build`` fires.
# ``build_hook.py`` is kept at repo root for documentation +
# unit-test reference (the helpers there still describe the
# canonical _build_info.py shape) but is no longer wired into
# setuptools. Dev installs use the runtime fallback in
# ``common/sheets/app_info.py::_git_short_sha``.

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: the ``loadgroup`` xdist distribution (so ``@pytest.mark.xdist_group``
# markers pin grouped tests to one worker) is NOT set here via ``addopts``
# — a no-xdist env (the wheel-smoke job, bare `pytest tests/unit`) would
# choke on an unrecognized ``--dist``. The historic auto-bump in
# ``tests/conftest.py::pytest_configure`` was deleted by CB.7-followup
# (its global scope caused the qs_browser marker-deselection × loadgroup
# cascade). It's now applied surgically at the app2 layer ONLY, via
# ``src/recon_gen/_dev/runner.py::_layer_command`` (the app2 branch
# appends ``--dist=loadgroup`` to the pytest command). That's where the
# BV.3.3 trainer dogfood module's ``xdist_group("trainer-<dialect>")``
# pin gets honored.
markers = [
    "e2e: end-to-end tests requiring deployed AWS resources",
    "api: API-only e2e tests (no browser)",
]

# DG.3 — always-on hang diagnostic. Pytest arms a faulthandler timer
# per test; any test running longer than this dumps stack traces of
# every Python thread to stderr + continues running (faulthandler
# reports, doesn't kill). Stdlib + pytest-core; no plugin, no
# dependency. The dump tells you exactly where a wedge is happening
# — Playwright in `run_forever`, psycopg blocked on socket recv,
# matview refresh stuck on a lock, etc.
#
# Tuned 180s = above the slowest legitimate test on local cold-spun
# Oracle (BV.3.3 trainer dogfood Session Start). If a regression
# adds a slower test, bump this rather than disabling the
# diagnostic.
faulthandler_timeout = 180

# W.8b — coverage config. ``source = ["recon_gen"]`` scopes
# coverage to the package; without it, ``coverage report`` lumps in
# the stdlib / third-party files that happened to execute. The CI
# matrix sets ``COVERAGE_FILE=.coverage.py<version>`` per entry so
# each matrix entry writes a uniquely-named data file the
# ``coverage`` aggregator job can ``coverage combine``.
[tool.coverage.run]
source = ["recon_gen"]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.paths]
# CB.17.g followup — `coverage combine` was not normalizing absolute
# paths recorded by the WSL2 self-hosted runner (under
# `/home/recon-gen/actions-runner/_work/...`) into the ubuntu-latest
# badge-aggregator job's checkout (`/home/runner/work/...`). With no
# `[paths]` section, `coverage report` then exited 1 because no
# recorded path matched a real file in the report job's checkout.
# Mapping these aliases to the canonical `src/` location lets combine
# fold them at merge time and report find them at render time.
source = [
    "src/",
    "/home/recon-gen/actions-runner/_work/recon-gen/recon-gen/src/",
    "/home/runner/work/recon-gen/recon-gen/src/",
    "*/recon-gen/src/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 1

# Pyright is configured strict on the L.1 tree primitives. Scope stays
# tight for now — tests come in a follow-up sub-step (pytest patterns
# trip a lot of strict rules); apps stay outside until each L.{2,3,4}.13
# cleanup retires the imperative builders. Models + drill helpers are
# reachable through the tree but stay outside strict; pyright still
# resolves them via extraPaths for inference.
[tool.pyright]
# BF.3 + BE.7.D — entire src/recon_gen/ strict-clean (BF.1) AND all of
# tests/ strict-clean (BE.7.B + BE.7.C.2 + BE.7.C.3 / BF.4). Include
# now spans the whole code surface, not a curated subset. Default
# `pyright` (no args) runs at strict and lands at 0 errors.
include = [
    "src/recon_gen",
    "tests",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src"]
# Pin the venv so pyright resolves third-party stubs (Playwright,
# psycopg). Without this, ad-hoc ``pyright <file>``
# invocations on files in scope above can't resolve those packages
# and surface ~300 false-positive "type is unknown" cascades. The
# ``venvPath`` is the parent directory; ``venv`` is the directory
# name inside it.
venvPath = "."
venv = ".venv"
# Module-private leading-underscore helpers are intentionally shared
# across tree submodules (e.g. `_calc_field_in` in calc_fields.py used
# by filters.py / actions.py). Pyright flags this under `reportPrivateUsage`
# but the codebase treats them as package-internal — suppressing keeps
# the convention without renaming everything to drop the underscore.
reportPrivateUsage = false

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.0",
]
