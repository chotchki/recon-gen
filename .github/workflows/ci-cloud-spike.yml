# EA.2 — THROWAWAY cloud-runner spike. Proves the full test chain runs on a
# GitHub-hosted ubuntu-latest runner (the self-hosted WSL2 box's QS/AWS
# rationale is moot post-v16 — see docs/audits/ea_1_self_hosted_rationale.md).
#
# Scope (operator-confirmed): the FULL chain — PG + Oracle + DuckDB. Oracle
# is NOT the blocker EA.1 assumed: `_resolve_oracle_image()` auto-falls-back
# to `gvenzl/oracle-free:23-faststart` (pullable, multi-arch, ~20-30s) when
# the box's un-pullable `oracle-19c:local` isn't present — exactly a fresh
# runner. And subsetting the chain to PG+du is HARDER than including Oracle
# (`up_to` has no dialect flag; the db-tier runs both by default). So one
# full run proves the whole genuinely-new surface AND the EA.3 Oracle-on-
# cloud question together:
#   - self-signed TLS instead of ACME/Cloudflare (RECON_GEN_TLS_SELF_SIGNED)
#   - fresh-ephemeral PG + gvenzl-Oracle instead of the box's persistent ones
#   - the Dex OIDC IdP + WebKit auth flow on a hosted runner
#   - the CE.4 trainer-hang un-pin (du,pg,or) — coupling-3 experiment
#   - peak-RSS capture (`/usr/bin/time -v`) surfaces any OOM on 4-core/16GB
#
# Hostname strategy = PRIMARY: keep the locked `localci.recon-gen.hotchkiss.io`
# SAN (de-locks nothing), resolve it to 127.0.0.1 via /etc/hosts, self-sign it.
# NOT wired into ci.yml/release.yml — manual `workflow_dispatch` only. Delete
# once EA.4 flips the real ci.yml.
name: CI cloud spike (EA.2)

# workflow_dispatch is only triggerable once a workflow is on the DEFAULT
# branch (GitHub rule) — this lives on feature/ea, so it isn't dispatchable
# yet. The push trigger (path-filtered to THIS file) is the feature-branch
# lever: pushing a change to the spike workflow runs the spike, while
# unrelated feature/ea pushes don't. Retire the whole file at EA.4.
on:
  workflow_dispatch: {}
  push:
    branches: [feature/ea]
    paths: [".github/workflows/ci-cloud-spike.yml"]

concurrency:
  group: ci-cloud-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloud-spike:
    name: Cloud spike (PG + Oracle + DuckDB, self-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (uv sync from uv.lock)
        run: uv sync --frozen --extra dev --extra prod

      - name: Install Playwright WebKit browser (+ system deps)
        # --with-deps because a fresh ubuntu-latest has none of the WebKit
        # system libs the WSL2 box pre-bakes; sudo works on hosted runners.
        run: .venv/bin/playwright install --with-deps webkit

      - name: Set up biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.14

      - name: Install GNU time
        # /usr/bin/time (GNU) isn't on ubuntu-latest by default — only the
        # bash `time` builtin. Needed for the peak-RSS capture below.
        run: sudo apt-get update && sudo apt-get install -y time

      - name: Generate random DB passwords
        # hex 14 = 28 alphanumeric chars — clears Oracle's letter+digit+8char
        # rule and fits its 30-byte quoted-identifier limit (CE.4-followup).
        run: |
          PG_PASSWORD=$(openssl rand -hex 14)
          ORACLE_PASSWORD=$(openssl rand -hex 14)
          echo "::add-mask::${PG_PASSWORD}"
          echo "::add-mask::${ORACLE_PASSWORD}"
          {
            echo "PG_PASSWORD=${PG_PASSWORD}"
            echo "ORACLE_PASSWORD=${ORACLE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Generate random OIDC credentials
        run: |
          OIDC_CLIENT_SECRET=$(openssl rand -hex 14)
          JWT_SECRET=$(openssl rand -hex 32)
          DEX_USER_PASSWORD=$(openssl rand -hex 14)
          echo "::add-mask::${OIDC_CLIENT_SECRET}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${DEX_USER_PASSWORD}"
          {
            echo "RECON_GEN_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}"
            echo "RECON_GEN_JWT_SECRET=${JWT_SECRET}"
            echo "RECON_GEN_DEX_USER_PASSWORD=${DEX_USER_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Spin a FRESH Postgres container
        # No flock / adopt / rename / reuse (the box's persistent-container
        # dance) — the VM is discarded at job end. Tuned to match the box's
        # PG_CMD so connection + shm headroom are equivalent.
        run: |
          docker run -d --name ci-shared-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD="${PG_PASSWORD}" --shm-size=2g \
            postgres:17-alpine -c max_connections=300 -c shared_buffers=1GB
          echo "Waiting for Postgres..."
          timeout 60 bash -c 'until docker exec ci-shared-pg pg_isready -U postgres -q; do sleep 2; done'

      - name: Spin a FRESH Oracle container (gvenzl faststart)
        # gvenzl/oracle-free:23-faststart is pullable + multi-arch (the box's
        # oracle-19c:local is un-pullable). ORACLE_PASSWORD sets the system
        # password at init; it exposes service FREEPDB1 matching the cfg URL.
        # Readiness = gvenzl's own "DATABASE IS READY TO USE!" log marker
        # (v1 relied on Docker's HEALTHCHECK status, which stayed empty and
        # timed out at 600s — v1's failure). Detect a crashed container early
        # + dump logs on any failure so a red Oracle is diagnosable.
        run: |
          docker run -d --name ci-shared-oracle -p 1521:1521 \
            -e ORACLE_PASSWORD="${ORACLE_PASSWORD}" \
            gvenzl/oracle-free:23-faststart
          echo "Waiting for Oracle 'DATABASE IS READY TO USE'..."
          for _ in $(seq 1 180); do
            if docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle ready."; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ci-shared-oracle 2>/dev/null)" != "true" ]; then
              echo "::error::Oracle container is not running — logs:"; docker logs ci-shared-oracle 2>&1 | tail -60; exit 1
            fi
            sleep 5
          done
          if ! docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
            echo "::error::Oracle never became ready (15 min) — logs:"; docker logs ci-shared-oracle 2>&1 | tail -60; exit 1
          fi

      - name: Pre-generate the self-signed TLS cert + trust it
        # Mint the self-signed cert for the CI SANs BEFORE the chain (via the
        # EA.2 RECON_GEN_TLS_SELF_SIGNED branch in _dev/tls/ensure.py), so the
        # runner's own ensure_dev_env finds it already-valid and skips
        # re-minting. httpx trusts certifi's bundle (NOT SSL_CERT_FILE), so we
        # APPEND the cert to certifi — this is the load-bearing trust step for
        # the server-side authlib/Dex-readiness HTTPS calls. SSL_CERT_FILE is
        # belt-and-suspenders for any stdlib-ssl consumer.
        run: |
          CERT_DIR="$HOME/.local/share/recon-gen/tls/ci"
          mkdir -p "$CERT_DIR"
          RECON_GEN_TLS_SELF_SIGNED=1 .venv/bin/python - <<'PY'
          from pathlib import Path
          from recon_gen._dev.tls.ensure import ensure_dev_env, Env
          d = Path.home() / ".local/share/recon-gen/tls/ci"
          ensure_dev_env(
              Env.CI, cert_path=d / "cert.pem", key_path=d / "key.pem",
              account_email="spike@localhost",
          )
          print("self-signed cert minted at", d)
          PY
          CERTIFI="$(.venv/bin/python -c 'import certifi; print(certifi.where())')"
          cat "$CERT_DIR/cert.pem" >> "$CERTIFI"
          echo "SSL_CERT_FILE=${CERTIFI}" >> "$GITHUB_ENV"
          echo "Appended self-signed cert to ${CERTIFI}"

      - name: Map the CI hostname to loopback (PRIMARY)
        # The locked issuer/redirect SAN resolves to the local Dex + App2 here.
        run: echo "127.0.0.1 localci.recon-gen.hotchkiss.io ci.recon-gen.hotchkiss.io" | sudo tee -a /etc/hosts

      - name: Materialize the per-dialect runner cfgs
        # Two cfgs (postgres primary + oracle). The chain resolves
        # config.postgres.yaml as RECON_GEN_CONFIG (candidate order); the
        # db-tier @dialects(PG, OR) tests reach both containers via the
        # DEMO_DATABASE_URL_* env below. Both carry the same self-signed
        # OIDC/TLS blocks (PRIMARY hostname, dummy account_email).
        run: |
          mkdir -p run
          for D in postgres oracle; do
            if [ "$D" = "postgres" ]; then
              DB_URL="postgresql://postgres:${PG_PASSWORD}@127.0.0.1:5432/postgres"
            else
              DB_URL="oracle+oracledb://system:${ORACLE_PASSWORD}@127.0.0.1:1521/?service_name=FREEPDB1"
            fi
            cat > "run/config.${D}.yaml" <<EOF
          db:
            dialect: "${D}"
            url: "${DB_URL}"
            table_prefix: "recon_spike_${{ github.run_id }}_${D:0:2}"
            default_l2_instance: "tests/l2/sasquatch_pr.yaml"
          auth:
            oidc:
              issuer_url: "https://localci.recon-gen.hotchkiss.io:5556/dex"
              client_id: "recon-gen-app2-test"
              client_secret_env: "RECON_GEN_OIDC_CLIENT_SECRET"
              redirect_uri: "https://localci.recon-gen.hotchkiss.io:8765/auth/callback"
              scopes:
                - "openid"
                - "email"
                - "profile"
            session:
              jwt_secret_env: "RECON_GEN_JWT_SECRET"
          app2:
            tls:
              cert_path: "~/.local/share/recon-gen/tls/ci/cert.pem"
              key_path: "~/.local/share/recon-gen/tls/ci/key.pem"
              account_email: "spike@localhost"
              env: "ci"
          EOF
          done

      - name: Run the full layered chain (unit → agreement)
        env:
          # Self-signed instead of ACME (NO CLOUDFLARE_TOKEN — the self-signed
          # branch never calls Cloudflare, and its absence makes any accidental
          # fall-through fail loud rather than silently mint).
          RECON_GEN_TLS_SELF_SIGNED: "1"
          RECON_GEN_BROWSER_INSECURE_TLS: "1"
          # Point every layer + seed subprocess at the fresh containers (the
          # CB.17.f env-URL short-circuit — the db-tier reaches both).
          RECON_GEN_DEMO_DATABASE_URL_PG: "postgresql://postgres:${{ env.PG_PASSWORD }}@127.0.0.1:5432/postgres"
          RECON_GEN_DEMO_DATABASE_URL_OR: "oracle+oracledb://system:${{ env.ORACLE_PASSWORD }}@127.0.0.1:1521/?service_name=FREEPDB1"
          RECON_GEN_RUNNER_YES: "1"
          # Coupling-3 experiment: un-pin the trainer dialects (box pins "du"
          # to dodge a hang that only reproduces on its PERSISTENT PG/Oracle).
          # Fresh containers are the condition the hang comment says doesn't
          # repro — if this passes, the box CI can migrate to fresh-per-run.
          RECON_GEN_TRAINER_DIALECTS: "du,pg,or"
        run: |
          mkdir -p runs
          /usr/bin/time -v -o runs/peak-rss-time.log \
            ./run_tests.sh up_to=agreement --coverage
          echo "--- peak RSS ---"
          grep "Maximum resident set size" runs/peak-rss-time.log || true

      - name: Upload runner artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-spike-runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        run: docker rm -f ci-shared-pg ci-shared-oracle recon-gen-test-dex || true
