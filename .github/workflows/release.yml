# Release workflow — trimmed under CB.11.c (2026-06-02).
#
# Pre-CB.11.c shape had 9 jobs: tests, build, smoke, publish-testpypi,
# verify-testpypi-install, e2e-against-testpypi, release-coverage,
# publish-pypi, verify-pypi-install, github-release. The `tests` +
# `release-coverage` + `verify-testpypi-install` + `e2e-against-testpypi`
# + `verify-pypi-install` jobs duplicated work that ci.yml already
# does — and ci.yml is now the layered runner that covers everything
# from unit → qs_browser on one self-hosted box.
#
# New shape — 5 jobs:
#   build → smoke → publish-testpypi → publish-pypi → github-release
#
# Trigger model:
#   - push tags v*  → tag-driven publish (original release path)
#   - workflow_run  → fires after ci.yml succeeds on main + tag push
#                     (CI must be green before any publish-shaped work
#                     starts; gates the v* tag pipeline on the
#                     just-completed CI run)
#
# Sensitive-credential rationale preserved: build / smoke remain on
# ubuntu-latest (clean-room — no chance of self-hosted runner state
# leaking into a published wheel). Publish jobs use Trusted Publisher
# OIDC, not stored tokens.

name: Release

on:
  push:
    tags:
      # Stable: v8.7.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # PEP 440 pre-releases.
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

  # CB.11.c — fire after ci.yml succeeds on main. The `build` job's
  # `if:` clause then short-circuits on workflows that aren't real tag
  # pushes (workflow_run doesn't carry a ref of the tag — it inherits
  # the head SHA of the triggering workflow). The actual publish path
  # is still tag-driven; this trigger is here to surface "CI on main
  # is green" as a release-readiness signal in the workflow list, AND
  # to give downstream automation a hook (e.g. a future "auto-tag on
  # main" job) a stable workflow to wait on.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate the entire release pipeline on CI green for this exact SHA.
  #
  # CB.17.n — pre-CB.17.n the tag-push trigger fired publish jobs
  # immediately, with no proof CI had passed on the tagged commit.
  # That was fine in practice (operator always pushes `main v<tag>`
  # together so ci.yml was running in parallel), but nothing in the
  # automation enforced it — a tag pushed to a never-merged SHA would
  # publish unconditionally.
  #
  # This job blocks every downstream job until the CI workflow on
  # `github.sha` reaches `completed`/`success`. ci.yml triggers on
  # `push: branches: [main]`, not on tags, so we look up the CI run by
  # commit SHA (same SHA was pushed to main moments before the tag).
  #
  # Bootstrap window: tag push can outrun main push by seconds. We
  # poll for up to 5 min for a CI run to APPEAR before declaring the
  # tag orphaned. After that, we poll for up to 90 min for it to
  # FINISH (CI's qs_browser layer can take ~30 min; 90 min is comfort
  # margin without going unbounded).
  # ---------------------------------------------------------------------------
  wait-for-ci:
    name: Wait for CI to pass on tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Poll CI run status on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Looking for CI run on $SHA"
          RUN_ID=""
          # Bootstrap: wait up to 5 min for a CI run to appear.
          for i in $(seq 1 30); do
            RUN_ID=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0].id // empty')
            if [ -n "${RUN_ID}" ]; then
              echo "Found CI run ${RUN_ID} after $((i * 10))s"
              break
            fi
            echo "[bootstrap ${i}/30] no CI run yet for ${SHA}"
            sleep 10
          done
          if [ -z "${RUN_ID}" ]; then
            echo "::error::No CI run appeared for ${SHA} within 5 min — was main pushed?"
            exit 1
          fi
          # Poll for completion: up to 90 min.
          for i in $(seq 1 90); do
            RESULT=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" \
              --jq '"\(.status) \(.conclusion)"')
            STATUS=$(echo "${RESULT}" | awk '{print $1}')
            CONCL=$(echo "${RESULT}" | awk '{print $2}')
            echo "[poll ${i}/90] CI ${RUN_ID}: status=${STATUS} conclusion=${CONCL}"
            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCL}" = "success" ]; then
                echo "CI passed on ${SHA}; release pipeline cleared."
                exit 0
              fi
              # ci.yml::test-everything intentionally skips when the
              # commit message starts with "Release v" (so push-CI
              # doesn't duplicate this Release workflow's pipeline).
              # The downstream jobs all `needs: test-everything`, so
              # the whole CI run reports `skipped` for Release
              # commits. That's a deliberate green, not a failure —
              # the LAST pre-Release CI on main must have been green
              # for the operator to cut the tag in the first place.
              if [ "${CONCL}" = "skipped" ]; then
                echo "CI on ${SHA} was skipped (Release commit gate, ci.yml line 59); release pipeline cleared."
                exit 0
              fi
              echo "::error::CI on ${SHA} concluded ${CONCL}; refusing to publish."
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on ${SHA} did not complete within 90 min."
          exit 1

  # ---------------------------------------------------------------------------
  # Build sdist + wheel.
  #
  # CB.11.c — `tests` job is gone. ci.yml is the layered runner that
  # already covered unit + integration + e2e at merge / pre-merge time;
  # re-running them here on every tag was duplicate work. For the
  # workflow_run trigger, the `if:` clause keeps build/etc. inert —
  # only the `push: tags` trigger drives real publishes.
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    needs: [wait-for-ci]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # See ci.yml for the rationale on dropping actions/setup-python.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (uv sync; build + twine are in [dev])
        run: uv sync --frozen --extra dev

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(.venv/bin/python -c "import tomllib, pathlib; \
            data = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); \
            attr = data['tool']['setuptools']['dynamic']['version']['attr']; \
            mod, var = attr.rsplit('.', 1); \
            import importlib, sys; sys.path.insert(0, 'src'); \
            print(getattr(importlib.import_module(mod), var))")
          echo "tag=${TAG} package=${PKG_VERSION}"
          if [ "${TAG}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}"
            exit 1
          fi

      - name: Build sdist + wheel
        run: .venv/bin/python -m build

      - name: Sync shim version + recon-gen pin to ${TAG} (AC.F.1 lockstep)
        # AA.A.996.release-fix, 2026-05-18 — CI is the authoritative bumper;
        # this step rewrites the shim's in-tree version from ${TAG} so
        # manual lockstep can no longer drift.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${TAG}\"/" quicksight-gen-shim/pyproject.toml
          sed -i "s/^    \"recon-gen==.*/    \"recon-gen==${TAG}\",/" quicksight-gen-shim/pyproject.toml
          echo "--- shim pyproject.toml after sync ---"
          grep -E '^(version|    "recon-gen==)' quicksight-gen-shim/pyproject.toml

      - name: Build quicksight-gen shim (AC.F.1 — PyPI deprecation shim)
        run: .venv/bin/python -m build --outdir dist/ quicksight-gen-shim/

      - name: Verify long description renders on PyPI
        run: .venv/bin/twine check dist/*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Smoke-test the wheel in a fresh clean-room venv.
  #
  # Kept as the sanity check between build and publish: proves the
  # wheel installs and the CLI/import surface works without the repo
  # checkout's src/ tree. ci.yml didn't cover this (it tests the
  # editable install), so this is genuinely additive.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/qs-smoke
          /tmp/qs-smoke/bin/pip install --upgrade pip
          /tmp/qs-smoke/bin/pip install dist/*.whl pytest pytest-cov boto3-stubs[quicksight] psycopg2-binary

      - name: Verify CLI version flag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          OUT=$(/tmp/qs-smoke/bin/recon-gen --version)
          echo "${OUT}"
          echo "${OUT}" | grep -q "${TAG}" || { echo "::error::--version output missing tag ${TAG}"; exit 1; }

      - name: Run lightweight unit tests against installed wheel
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # Skip pytest_sessionstart's pyright gate — pyright isn't
          # installed against the smoke venv. The wheel itself is the
          # subject under test, not its pyright cleanliness.
          RECON_GEN_SKIP_PYRIGHT: "1"
        run: |
          /tmp/qs-smoke/bin/pytest \
            tests/unit/test_models.py \
            tests/unit/test_theme_presets.py \
            tests/json/test_dataset_contract.py

      - name: Smoke import the public surface
        run: |
          /tmp/qs-smoke/bin/python -c "
          from recon_gen.common.tree import App, Sheet
          from recon_gen.common.tree.visuals import KPI, Table, BarChart, Sankey
          from recon_gen.common.tree.filters import FilterGroup
          from recon_gen.common.tree.actions import Drill
          from recon_gen.common.dataset_contract import DatasetContract, ColumnSpec
          from recon_gen.common.config import Config
          from recon_gen.apps.l1_dashboard.app import build_l1_dashboard_app
          from recon_gen.apps.l2_flow_tracing.app import build_l2_flow_tracing_app
          from recon_gen.apps.investigation.app import build_investigation_app
          from recon_gen.apps.executives.app import build_executives_app
          print('public surface importable')
          "

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI (Trusted Publisher OIDC, no tokens).
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [smoke]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/recon-gen
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # Publish to PyPI.
  #
  # CB.11.c — verify-testpypi-install + e2e-against-testpypi were the
  # pre-CB.11.c gates between TestPyPI and PyPI. Both are gone:
  #   - verify-testpypi-install was duplicating smoke-test work against
  #     the post-CDN-propagation TestPyPI index. Marginal value relative
  #     to the noise (CDN retry loops); ci.yml's full layered chain is
  #     a stronger upstream signal.
  #   - e2e-against-testpypi ran the qs_browser tier against a deployed
  #     QS dashboard built from the TestPyPI wheel. ci.yml's qs_browser
  #     layer already runs this surface on every CI invocation against
  #     the same commit; re-running against the wheel was duplicative.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/recon-gen
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # GitHub Release with sdist + wheel.
  #
  # CB.11.c — release-coverage is gone (no longer aggregating across
  # the prior gauntlet of legs). ci.yml's coverage-badge job already
  # surfaces coverage on the `badges` branch; the GitHub Release page
  # links there from the README's badge instead of carrying a separate
  # snapshot.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract release notes for ${{ github.ref_name }}
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## v/ {
              if (capture) exit
              if ($1 == "##" && $2 == tag) { capture = 1; next }
            }
            /^---[[:space:]]*$/ { if (capture) exit }
            capture { print }
          ' RELEASE_NOTES.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::No release notes section found for ${GITHUB_REF_NAME} in RELEASE_NOTES.md"
            echo "Release ${GITHUB_REF_NAME}" > release-body.md
          fi
          echo "----- release body preview -----"
          cat release-body.md
          echo "--------------------------------"

      - name: Detect PEP 440 pre-release suffix
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" =~ ([ab]|rc)[0-9]+$ ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "make_latest=false"  >> "${GITHUB_OUTPUT}"
            echo "Detected pre-release tag: ${TAG}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "make_latest=true"   >> "${GITHUB_OUTPUT}"
            echo "Stable release tag: ${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease.outputs.make_latest }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: false
