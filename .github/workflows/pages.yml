name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # See ci.yml for the rationale on dropping actions/setup-python.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install docs dependencies (V.2 — uv sync from uv.lock)
        # BS.6 follow-up — mkdocs moved from [dev] to [prod] (since
        # `docs apply` is a production CLI verb). Pages needs [prod]
        # for the mkdocs deps. [dev] kept for `recon-gen` CLI tooling.
        run: uv sync --frozen --extra dev --extra prod

      - name: Build site
        # Goes through ``recon-gen docs apply`` instead of bare
        # ``mkdocs build`` so this Pages build exercises the same
        # code path an installed-wheel operator would. Catches the
        # bundled-mkdocs.yml resolution that broke pre-restructure.
        run: .venv/bin/recon-gen docs apply -o site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
