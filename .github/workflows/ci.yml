# CI — collapsed onto a single self-hosted runner (CB.11.c, 2026-06-02;
# further collapsed CB.17.f, 2026-06-04).
#
# The pre-CB.11.c shape had six top-level jobs plus a sibling `e2e.yml`
# workflow with another four. With the self-hosted recon-gen-ci-local
# box online and `./run_tests.sh up_to=qs_browser` driving every layer
# (unit → db → app2 → deploy → qs_api → qs_browser) under one roof —
# Docker, AWS QuickSight deploys, Playwright WebKit, teardown — the
# matrix collapses onto one self-hosted job. Post CB.17.d there is no
# cell loop: the runner runs ONE pytest invocation per layer; the
# shared PG + Oracle containers below are the substrate for every
# layer above unit; the CB.17.f env-URL short-circuit
# (`RECON_GEN_DEMO_DATABASE_URL_PG` / `_OR`) tells the runner not to
# re-spin its own container on top of CI's.
#
# What stays out:
# - `e2e.yml` is deleted (the layered runner does its work). The nightly
#   AWS-sweep belongs in `nightly-cost-sweep.yml`, not here.
# - `release.yml` no longer re-runs tests; it gates on this workflow's
#   `workflow_run` success (see `release.yml.new`).
# - `docs-portable-install` stays on ubuntu-latest — it's a wheel-extras
#   gate, not a runner-layer concern.
# - `coverage-badge` stays on ubuntu-latest — pure post-processing.

name: CI

# Trigger model — only fire on:
#   - push: main          (post-merge gate)
#   - pull_request: main  (pre-merge gate)
#   - workflow_dispatch   (operator manual override)
# Feature-branch pushes intentionally do NOT fire CI; the self-hosted
# runner is a finite resource and PR-on-main is the contract.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Auto-cancel superseded runs on the same branch. A rapid follow-up push
# obsoletes the older commit's CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # AWS OIDC for the qs_api / qs_browser layers
  contents: read
  actions: read     # `gh run list` if any cleanup helper needs it

jobs:
  test-everything:
    name: Layered runner (unit → qs_browser)
    # v12.0.0 followup, preserved: skip the push-CI when this is a
    # Release commit. The Release workflow (release.yml) fires on the
    # tag push and runs its own pipeline; the parallel push-CI burns
    # AWS rate-limit budget contending with it. Downstream jobs
    # `needs: test-everything`, so skipping here skips everything.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')

    # The WSL2 Ubuntu runner on the 5800X3D / 64GB Windows box.
    # Playwright WebKit system deps, libatomic1, Docker, AWS CLI, and
    # uv are pre-installed (see BY.4 ops doc). recon-gen-ci-local is
    # the unique label tying jobs to this physical host.
    runs-on: [self-hosted, recon-gen-ci-local]

    # Hard cap so a hung Playwright session doesn't pin the runner.
    # 90 min is comfortable headroom over the observed ~50 min wall on
    # a full qs_browser sweep (BY.2 baseline).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # `actions/setup-python` was dropped 2026-06-05: on the WSL2
        # self-hosted runner it only sees the OS-baked Python (e.g.
        # 3.12) and can't download arbitrary versions. uv downloads
        # python-build-standalone wheels for whatever .python-version
        # pins (default `python-preference = managed`), so a
        # 3.12-only host upgrades transparently. Hosted runners keep
        # working the same way — uv prefers its own managed Python
        # over the runner-provided one when the version mismatches.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (uv sync from uv.lock)
        # `--extra dev --extra prod` matches the broadest extras any
        # layer exercises (unit needs dev/pyright + playwright; db/app2
        # need prod for the seed + App2 server). Playwright + boto3-stubs
        # + pytest-xdist all live in [dev].
        run: uv sync --frozen --extra dev --extra prod

      - name: Install Playwright WebKit browser
        # WebKit system libs are pre-installed on the runner, so
        # --with-deps is omitted (it requires sudo). The browser binary
        # itself still needs per-version install.
        run: .venv/bin/playwright install webkit

      - name: Set up biome
        # biome is a standalone Rust binary; the pytest sessionstart
        # hook runs `biome check` as a gate when `biome` is on PATH.
        # Version pinned to match biome.jsonc schema.
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.14

      - name: Configure AWS credentials via OIDC
        # qs_api + qs_browser layers reach AWS for QuickSight deploys.
        # OIDC trust policy on `qs-gen-ci` role is documented in
        # `.github/E2E_SETUP.md` (carried over from e2e.yml).
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Generate random DB passwords (BX.248)
        # Per-workflow-run random passwords for the shared PG + Oracle
        # containers. `openssl rand -hex 14` gives 28 alphanumeric chars
        # — satisfies Oracle 19c's "letter + digit + 8+chars" rule, no
        # special chars to escape downstream, AND fits inside Oracle's
        # 30-byte quoted-identifier limit on `ALTER USER ... IDENTIFIED
        # BY "<pwd>"` (CE.4-followup; pre-fix used `-hex 16` = 32 chars
        # which tripped ORA-00972, silently failed the reset, and let
        # FAILED_LOGIN_ATTEMPTS lock the system account → ORA-28000).
        # Exported via $GITHUB_ENV so all subsequent steps see
        # PG_PASSWORD / ORACLE_PASSWORD. Replaces the pre-BX.248
        # source-checked `postgres` / `qsgentestpwd2026` literals.
        #
        # v13.3.0 followup — `::add-mask::` redacts the generated value
        # from every subsequent log frame (env blocks, command output,
        # anywhere GHA prints them). Without it the env-block GHA dumps
        # before every step shows PG_PASSWORD / ORACLE_PASSWORD in
        # clear text, since the values aren't secrets (GHA auto-masks
        # `${{ secrets.* }}` values but has no way to know about
        # runtime-generated strings unless we tell it).
        run: |
          PG_PASSWORD=$(openssl rand -hex 14)
          ORACLE_PASSWORD=$(openssl rand -hex 14)
          echo "::add-mask::${PG_PASSWORD}"
          echo "::add-mask::${ORACLE_PASSWORD}"
          {
            echo "PG_PASSWORD=${PG_PASSWORD}"
            echo "ORACLE_PASSWORD=${ORACLE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Ensure shared PG + Oracle are up (reuse persistent containers when present)
        # CI box exposes PG on host port 5432 and Oracle on host port
        # 1521. `hotchkiss.io:5432` / `:1521` DDNS forwards point at
        # the CI box so QS-in-us-east-1 can reach the CI containers
        # from the runner-generated qs.yaml. (Dev-box pair owns 5433
        # / 1522; the port-preserve in `_swap_url_host` keeps the two
        # environments separable through DDNS.)
        #
        # If a persistent container is already bound to those ports —
        # reuse it (skip the start, record `STARTED_BY_CI=false` so
        # teardown leaves it alone). Otherwise bring fresh ones up.
        id: ensure_dbs
        run: |
          STARTED_PG=false
          STARTED_OR=false
          # CI-followup.1 — serialize concurrent CI runs through the
          # docker setup. Without this, two runs landing back-to-back
          # both enter the adoption-path retune branch
          # (docker rm -f ci-shared-pg; docker run -d --name ci-shared-pg)
          # and race: one rm -f wins, the other's run -d hits Conflict
          # because the first race-recreated the container. Bit
          # v13.11.0, v13.12.0, v13.13.x; manual unstick is
          # ``docker rm -f ci-shared-pg`` on the runner. /tmp persists
          # for the runner lifetime so the lockfile survives across
          # jobs/runs. 300s timeout so a wedged lock surfaces loud
          # instead of hanging forever. Acquired at script top via
          # ``exec`` (not a subshell) so the lock lives for the
          # duration of the bash script + STARTED_PG/STARTED_OR
          # variable scope is preserved for the trailing
          # ``$GITHUB_OUTPUT`` writes. Two separate locks (one per
          # container) rather than one giant lock so the failure mode
          # signals which resource is wedged when a lock-acquire
          # times out.
          exec 9>/tmp/ci-shared-pg.lock
          flock -w 300 9 || { echo "::error::Failed to acquire ci-shared-pg lock within 300s — runner is wedged"; exit 1; }
          exec 8>/tmp/ci-shared-oracle.lock
          flock -w 300 8 || { echo "::error::Failed to acquire ci-shared-oracle lock within 300s — runner is wedged"; exit 1; }
          # v13.3.0 followup — the reuse-by-port path didn't normalize
          # the existing container's name to ``ci-shared-pg`` /
          # ``ci-shared-oracle``, so the subsequent Force-reset step
          # (which hardcodes those names in ``docker exec``) blew up
          # with "No such container: ci-shared-pg". Rename the existing
          # container to the canonical name on the reuse path so every
          # downstream step works regardless of how the container got
          # there.
          # CL-followup — mirror `runner.py:_start_fresh_pg_container`
          # tuning so CI's adopted container matches local. Without
          # this, ci-shared-pg runs stock alpine defaults
          # (max_connections=100, shared_buffers=128MB), and qs_browser
          # under xdist `-n 4` saturates with "FATAL: sorry, too many
          # clients already". Local uses runner.py's _start_fresh_pg_
          # container path which already has the full tuning; CI takes
          # the env-URL short-circuit so the runner never gets to apply
          # it — hence this duplicate.
          PG_CMD=(postgres
            -c max_connections=300
            -c shared_buffers=1GB
            -c work_mem=32MB
            -c maintenance_work_mem=256MB
            -c effective_cache_size=4GB
            -c synchronous_commit=off
            -c shared_preload_libraries=pg_stat_statements)
          if nc -z 127.0.0.1 5432 2>/dev/null; then
            EXISTING_PG=$(docker ps --filter "publish=5432" --format '{{.Names}}' | head -1)
            if [ -z "${EXISTING_PG}" ]; then
              echo "::error::Port 5432 is bound but no Docker container owns it — runner is in an unexpected state." >&2
              exit 1
            fi
            if [ "${EXISTING_PG}" != "ci-shared-pg" ]; then
              echo "Shared PG already listening on :5432 as '${EXISTING_PG}' — renaming to ci-shared-pg."
              docker rename "${EXISTING_PG}" ci-shared-pg
            fi
            # Adoption-path retune: if the running container was started
            # with stale args (e.g. pre-CL-followup), kill + recreate
            # with the tuned cmd. Probing `SHOW max_connections;` is the
            # cheapest definitive check.
            EFFECTIVE_MAX_CONN=$(docker exec ci-shared-pg psql -U postgres -tAc "SHOW max_connections;" 2>/dev/null | tr -d '[:space:]' || echo "0")
            # DG.3 — also check /dev/shm size. Default Docker tmpfs is
            # 64MB which saturates on concurrent matview refreshes /
            # parallel queries and surfaces as
            # ``psycopg.errors.DiskFull: could not resize shared memory
            # segment ... No space left on device``. v13.15.1 release
            # gate hit this on test_inv_filters.py recipient fanout
            # KPIs. 2g is comfortable for the xdist -n 4 worker pool.
            EFFECTIVE_SHM=$(docker exec ci-shared-pg sh -c "df -B1 /dev/shm | tail -1 | awk '{print \$2}'" 2>/dev/null || echo "0")
            if [ "${EFFECTIVE_MAX_CONN}" != "300" ] || [ "${EFFECTIVE_SHM}" -lt 2000000000 ]; then
              echo "ci-shared-pg has max_connections=${EFFECTIVE_MAX_CONN} (expected 300) or /dev/shm=${EFFECTIVE_SHM} bytes (expected ≥2GB) — recreating with tuned args."
              docker rm -f ci-shared-pg
              docker run -d --name ci-shared-pg \
                --shm-size=2g \
                -e POSTGRES_PASSWORD="${PG_PASSWORD}" \
                -p 5432:5432 \
                postgres:17-alpine \
                "${PG_CMD[@]}"
              STARTED_PG=true
              echo "Waiting for retuned PG..."
              timeout 60 bash -c 'until docker exec ci-shared-pg pg_isready -U postgres -q; do sleep 2; done'
            else
              echo "ci-shared-pg already has max_connections=300 + /dev/shm≥2GB — reusing in place."
            fi
          else
            docker run -d --name ci-shared-pg \
              --shm-size=2g \
              -e POSTGRES_PASSWORD="${PG_PASSWORD}" \
              -p 5432:5432 \
              postgres:17-alpine \
              "${PG_CMD[@]}"
            STARTED_PG=true
            echo "Waiting for fresh PG..."
            timeout 60 bash -c 'until docker exec ci-shared-pg pg_isready -U postgres -q; do sleep 2; done'
          fi
          if nc -z 127.0.0.1 1521 2>/dev/null; then
            EXISTING_OR=$(docker ps --filter "publish=1521" --format '{{.Names}}' | head -1)
            if [ -n "${EXISTING_OR}" ] && [ "${EXISTING_OR}" != "ci-shared-oracle" ]; then
              echo "Shared Oracle already listening on :1521 as '${EXISTING_OR}' — renaming to ci-shared-oracle."
              docker rename "${EXISTING_OR}" ci-shared-oracle
            elif [ -z "${EXISTING_OR}" ]; then
              echo "::error::Port 1521 is bound but no Docker container owns it — runner is in an unexpected state." >&2
              exit 1
            else
              echo "Shared Oracle already named ci-shared-oracle — reusing in place."
            fi
          else
            docker run -d --name ci-shared-oracle \
              -e ORACLE_PWD="${ORACLE_PASSWORD}" \
              -e ORACLE_PDB=FREEPDB1 \
              -p 1521:1521 \
              recon-gen/oracle-19c:local
            STARTED_OR=true
            echo "Waiting for fresh Oracle (pre-init'd image, ~15-30s)..."
            timeout 180 bash -c 'until docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; do sleep 3; done'
          fi
          echo "started_pg=${STARTED_PG}" >> "$GITHUB_OUTPUT"
          echo "started_or=${STARTED_OR}" >> "$GITHUB_OUTPUT"
          echo "Shared DBs ready (CI-started: PG=${STARTED_PG} OR=${STARTED_OR})."

      - name: Force-reset PG + Oracle passwords to this run's random values
        # BX.248 — passwords are random per workflow_run (above), so on
        # adopted containers the in-container credential is whatever
        # the PREVIOUS workflow_run set it to. Reset both to this run's
        # values via local superuser auth that doesn't need the prior
        # password: PG via `psql -U postgres` over unix socket (trust
        # auth in pg_hba.conf for local connections), Oracle via
        # `sqlplus / as sysdba` (OS auth for the in-container oracle
        # user). Idempotent on fresh containers too.
        run: |
          docker exec ci-shared-pg \
            psql -U postgres -c "ALTER USER postgres WITH PASSWORD '${PG_PASSWORD}';"
          # CE.4-followup — ACCOUNT UNLOCK in case past runs racked up
          # FAILED_LOGIN_ATTEMPTS and locked the account (ORA-28000).
          # Also bump the DEFAULT profile to UNLIMITED so transient
          # stale-password retries during the BX.248 randomization
          # dance don't re-lock us. Idempotent.
          docker exec -i ci-shared-oracle bash -lc "sqlplus -s / as sysdba <<EOF
          ALTER USER system IDENTIFIED BY \"${ORACLE_PASSWORD}\" ACCOUNT UNLOCK;
          ALTER PROFILE default LIMIT FAILED_LOGIN_ATTEMPTS UNLIMITED PASSWORD_LIFE_TIME UNLIMITED;
          EXIT;
          EOF"

      - name: Materialize per-dialect runner cfgs (one cfg per dialect)
        # CB.17.f: dropped the `.qs.yaml` siblings. Post CB.17.d the
        # runner generates its own QS-side cfg per run via
        # `_write_qs_cfg_for_thin` — swaps host 127.0.0.1 → hotchkiss.io
        # so QS in us-east-1 can reach the dev/CI box, sets
        # `qs_disable_pg_ssl` for the postgres:17-alpine container.
        # All CI needs to materialize is the local cfg.
        #
        # `demo_database_url` points at the shared containers from the
        # step above. The env-URL short-circuit on the test step
        # (`RECON_GEN_DEMO_DATABASE_URL_PG` / `_OR`) tells the runner
        # not to re-spin its own; this URL is the cfg-side default
        # used for seed/deploy CLI subprocess invocations.
        # BX.248 — heredoc is UNquoted so `${PG_PASSWORD}` / `${ORACLE_PASSWORD}`
        # expand from the env. `${{ github.run_id }}` is GitHub template
        # syntax substituted by the runner BEFORE the shell sees it, so
        # unquoting the heredoc is safe.
        run: |
          mkdir -p run
          cat > run/config.postgres.yaml <<EOF
          aws:
            account_id: "470656905821"
            region: "us-east-1"
            deployment_name: "qs-ci-${{ github.run_id }}-pg"
            principal_arns:
              - "${{ secrets.RECON_E2E_USER_ARN }}"
          db:
            dialect: "postgres"
            url: "postgresql://postgres:${PG_PASSWORD}@127.0.0.1:5432/postgres"
            table_prefix: "qs_ci_${{ github.run_id }}_pg"
            default_l2_instance: "tests/l2/sasquatch_pr.yaml"
          auth:
            aws:
              quicksight_user_arn: "${{ secrets.RECON_E2E_USER_ARN }}"
          EOF
          cat > run/config.oracle.yaml <<EOF
          aws:
            account_id: "470656905821"
            region: "us-east-1"
            deployment_name: "qs-ci-${{ github.run_id }}-or"
            principal_arns:
              - "${{ secrets.RECON_E2E_USER_ARN }}"
          db:
            dialect: "oracle"
            url: "oracle+oracledb://system:${ORACLE_PASSWORD}@127.0.0.1:1521/?service_name=FREEPDB1"
            table_prefix: "qs_ci_${{ github.run_id }}_or"
            default_l2_instance: "tests/l2/sasquatch_pr.yaml"
          auth:
            aws:
              quicksight_user_arn: "${{ secrets.RECON_E2E_USER_ARN }}"
          EOF

      - name: Run the full layered chain (unit → qs_browser)
        # ./run_tests.sh up_to=qs_browser invokes the chain
        # unit → db → app2 → deploy → qs_api → qs_browser, ONE pytest
        # invocation per layer (post CB.17.d cell removal).
        # `--coverage` writes `.coverage.<run-id>.<layer>` files into
        # runs/<id>/.
        #
        # The `RECON_GEN_DEMO_DATABASE_URL_PG` / `_OR` env vars below
        # point at the shared containers from the top of the job. The
        # CB.17.f short-circuit in `_start_thin_container` honors them
        # and returns immediately — no testcontainers spin, no second
        # container competing for resources.
        #
        # `RECON_GEN_E2E=1` lets the e2e-tier pytest collections run.
        # `RECON_E2E_USER_ARN` is consumed by the qs_browser layer for
        # embed URL minting (also derivable from cfg.auth, kept
        # explicit for parity with the legacy e2e.yml shape).
        env:
          RECON_GEN_E2E: "1"
          RECON_E2E_USER_ARN: ${{ secrets.RECON_E2E_USER_ARN }}
          # CB.17.f env-URL short-circuit — runner reads these from
          # `_start_thin_container` and skips its own container spin.
          # Both the seed (`recon-gen schema apply` etc.) and the
          # deploy subprocess inherit them and reach the shared
          # containers directly.
          RECON_GEN_DEMO_DATABASE_URL_PG: "postgresql://postgres:${{ env.PG_PASSWORD }}@127.0.0.1:5432/postgres"
          RECON_GEN_DEMO_DATABASE_URL_OR: "oracle+oracledb://system:${{ env.ORACLE_PASSWORD }}@127.0.0.1:1521/?service_name=FREEPDB1"
          # RECON_GEN_RUNNER_YES bypasses the destructive-op prompt;
          # the runner needs it in non-interactive CI.
          RECON_GEN_RUNNER_YES: "1"
          # CE.4-followup-4 (2026-06-04) — re-pin to DuckDB. CE.4 was
          # the unpin; CE.4-followups #1-#3 fixed Oracle password
          # length (ORA-00972 from 32-char quoted-identifier limit) +
          # account-unlock (ORA-28000 from accumulated failed logins) +
          # xdist_group cross-worker contention. But Session Start on
          # the CI's shared persistent PG/Oracle containers STILL hangs
          # at the browser→HTTP→studio_server stack — 14 trainer tests
          # erred with Page.wait_for_function: Timeout 600000ms, same
          # symptom 3 CI cycles running, despite CE.0 measuring 33s on
          # a fresh local PG container via direct Python. The bug
          # reproduces in CI but not locally and we can't trace why
          # from log-only triage. Re-pin to DuckDB; file as backlog;
          # CF cold-read defects have higher leverage.
          RECON_GEN_TRAINER_DIALECTS: "du"
        # CB.17.h — wrap the chain in /usr/bin/time -v so the WSL2
        # runner records peak RSS (Maximum resident set size). The
        # value lands at the end of the step log and (via the
        # `tee runs/<id>-time.log` below) in the runs/ artifact for
        # post-CB.15 drift tracking — the OOM that triggered the cell
        # collapse should no longer reproduce. Per
        # [[feedback_timings_as_smell]], capture as data — let drift
        # speak.
        run: |
          mkdir -p runs
          /usr/bin/time -v -o runs/peak-rss-time.log \
            ./run_tests.sh up_to=qs_browser --coverage
          echo "--- /usr/bin/time -v summary ---"
          cat runs/peak-rss-time.log
          echo "--- peak RSS ---"
          grep "Maximum resident set size" runs/peak-rss-time.log || true

      - name: Upload runner artifacts (triage parity)
        # The `runs/<run-id>/` tree is the same artifact shape an
        # operator sees locally — per-variant per-layer cmd.json /
        # stdout.log / stderr.log / timings.json + screenshots from any
        # failing browser tests. The local `_dev/runner.py::collect_run_outputs`
        # already lays it out canonically.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage data files
        # CB.17.g: per-layer `.coverage.<layer>` files land directly at
        # cwd (REPO_ROOT) — the runner's COVERAGE_FILE override sets
        # them there. No `find runs -name '.coverage.*' | xargs cp .`
        # staging step needed. The aggregator job downloads this
        # artifact and runs `coverage combine`.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-runner
          path: .coverage.*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Surface top-queries in Step Summary + upload as artifact
        # CB.17.k — the `capture_top_queries` teardown writes
        # `runs/<id>/db/<dialect>/top-queries.md` with pg_stat_statements
        # / v$sqlstats top-50 for each dialect the session touched. Render
        # them inline in the GitHub Step Summary (same UX as the coverage
        # report) AND upload as a focused artifact so it's downloadable
        # without grabbing the full multi-GB runs/ tree.
        if: always()
        run: |
          {
            echo "# Top expensive queries"
            echo ""
            echo "_From \`capture_top_queries\` session-teardown; "
            echo "filter LIKE matches the cfg's \`db_table_prefix\`._"
            echo ""
            for f in $(find runs -name "top-queries.md" 2>/dev/null | sort); do
              echo ""
              echo "---"
              echo ""
              echo "<sub>${f}</sub>"
              echo ""
              cat "$f"
            done
          } > top-queries-summary.md
          if [ -s top-queries-summary.md ]; then
            cat top-queries-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No top-queries.md files found in runs/. " \
              "Either no DB-touching test layer fired, " \
              "or capture_top_queries hit its skip path." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload top-queries artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: top-queries-${{ github.run_id }}
          path: |
            top-queries-summary.md
            runs/*/db/*/top-queries.md
          if-no-files-found: warn
          retention-days: 30

      - name: Stop shared PG + Oracle containers (only if this run started them)
        # Teardown is conditional on the `ensure_dbs` step's outputs —
        # if CI reused persistent containers, leave them running for
        # the next run; if CI brought fresh ones up, tear them down.
        if: always()
        run: |
          if [ "${{ steps.ensure_dbs.outputs.started_pg }}" = "true" ]; then
            docker stop ci-shared-pg 2>/dev/null || true
            docker rm ci-shared-pg 2>/dev/null || true
          fi
          if [ "${{ steps.ensure_dbs.outputs.started_or }}" = "true" ]; then
            docker stop ci-shared-oracle 2>/dev/null || true
            docker rm ci-shared-oracle 2>/dev/null || true
          fi

      - name: Sweep deployed QS resources (always)
        # Belt-and-suspenders: even though the runner's per-cell teardown
        # is supposed to be idempotent, a runner-killed-mid-job case
        # (timeout, OOM, manual cancel) leaves QS dashboards behind. The
        # `json clean` here scopes by `Deployment` tag — uses the same
        # deployment_name we wrote into the cfgs above, so it only
        # sweeps THIS run's resources.
        if: always()
        run: |
          mkdir -p /tmp/empty-out
          .venv/bin/recon-gen json clean -c run/config.postgres.yaml -o /tmp/empty-out --execute || true
          .venv/bin/recon-gen json clean -c run/config.oracle.yaml -o /tmp/empty-out --execute || true

  # Build a wheel from the current commit, install it in a fresh venv
  # (NOT an editable / src-tree install), and run `docs apply --portable`
  # end-to-end. Catches regressions where docs sourcing assumes a repo
  # checkout. Unchanged from pre-CB.11.c — pure wheel-extras gate.
  docs-portable-install:
    needs: test-everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # `actions/setup-python` was dropped 2026-06-05: on the WSL2
        # self-hosted runner it only sees the OS-baked Python (e.g.
        # 3.12) and can't download arbitrary versions. uv downloads
        # python-build-standalone wheels for whatever .python-version
        # pins (default `python-preference = managed`), so a
        # 3.12-only host upgrades transparently. Hosted runners keep
        # working the same way — uv prefers its own managed Python
        # over the runner-provided one when the version mismatches.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build wheel
        # `uv build` uses uv's managed Python automatically (no
        # `actions/setup-python` step → no system Python to install
        # `build` against). Replaces the prior
        # `uv pip install --system build && python -m build` shape
        # which broke when we dropped setup-python on 2026-06-05.
        run: uv build --wheel --out-dir /tmp/wheelhouse

      - name: Install wheel into a fresh venv (NOT editable)
        run: |
          uv venv /tmp/portable-test-venv
          uv pip install --python /tmp/portable-test-venv/bin/python \
              "$(ls /tmp/wheelhouse/recon_gen-*.whl)[prod]"

      - name: Build portable docs from installed wheel
        run: |
          /tmp/portable-test-venv/bin/recon-gen docs apply \
              --portable -o /tmp/portable-site
          test -f /tmp/portable-site/index.html
          test -f /tmp/portable-site/handbook/l1.html

      - name: Portable docs carry the L2 theme + site.css is persona-neutral (X.2.s.2)
        run: |
          set -e
          L2=/tmp/portable-site/stylesheets/_l2_theme.css
          SITE=/tmp/portable-site/stylesheets/site.css
          test -f "$L2" || { echo "::error::_l2_theme.css not generated — theming code didn't run"; exit 1; }
          grep -q -- '--qs-accent:' "$L2" || { echo "::error::_l2_theme.css doesn't set --qs-accent"; exit 1; }
          grep -qi '#2E5090' "$L2"        || { echo "::error::_l2_theme.css missing the bundled L2 accent"; exit 1; }
          grep -q 'stylesheets/_l2_theme.css' /tmp/portable-site/index.html || { echo "::error::index.html doesn't link _l2_theme.css"; exit 1; }
          grep -q 'var(--qs-accent)' "$SITE" || { echo "::error::site.css doesn't route through --qs-accent"; exit 1; }
          if grep -qi -- '--snb-\|2B4A2E' "$SITE"; then
            echo "::error::site.css still hard-codes the SNB palette (X.2.s.2 regression)"; exit 1
          fi

      - name: docs serve starts from installed wheel (X.2.s.1)
        run: |
          set +e
          cd /tmp  # ensure cwd has no docs/_macros — the failure cwd
          timeout 30 /tmp/portable-test-venv/bin/recon-gen docs serve \
              -p 8765 > /tmp/serve.log 2>&1
          set -e
          echo "--- docs serve output ---"; cat /tmp/serve.log
          if grep -qi "_macros.*does not exist\|does not exist.*_macros" /tmp/serve.log; then
            echo "::error::docs serve hit the X.2.s.1 macros-path regression"
            exit 1
          fi
          grep -qi "Serving on" /tmp/serve.log || {
            echo "::error::docs serve never reached 'Serving on'"
            exit 1
          }

  # Combine coverage data, render markdown + HTML reports, generate the
  # SVG badge, push to the `badges` branch. Merges the W.8b coverage job
  # and the prior coverage-badge job — there's only one source of
  # coverage data now (the runner), so the two-step indirection is gone.
  coverage-badge:
    name: Combine coverage + push badge
    needs: test-everything
    # Only push the badge on main pushes — PRs and dispatches still
    # render the report (Step Summary + artifacts) but skip the push.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # `actions/setup-python` was dropped 2026-06-05: on the WSL2
        # self-hosted runner it only sees the OS-baked Python (e.g.
        # 3.12) and can't download arbitrary versions. uv downloads
        # python-build-standalone wheels for whatever .python-version
        # pins (default `python-preference = managed`), so a
        # 3.12-only host upgrades transparently. Hosted runners keep
        # working the same way — uv prefers its own managed Python
        # over the runner-provided one when the version mismatches.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (just coverage tooling)
        run: uv sync --frozen --extra dev

      - name: Download runner coverage data
        uses: actions/download-artifact@v6
        with:
          name: coverage-data-runner

      - name: Combine coverage data files
        run: .venv/bin/coverage combine

      - name: Render markdown report (Step Summary + artifact)
        # CI-followup.3 (2026-06-10) — `coverage report` errored with
        # `No source for code: 'src/quicksight_gen/__init__.py'` on
        # stale coverage data referencing the pre-rename package path.
        # `--ignore-errors` skips files with missing source and lets
        # the report render the rest. The actual coverage data IS valid
        # — only the stale-path entries are bad. Applied to every
        # `coverage report` / `coverage html` / `coverage xml` call
        # in this job so a single stale entry doesn't poison the
        # whole job.
        run: |
          {
            echo "# Coverage report"
            echo ""
            echo "_Generated by CB.11.c collapsed CI on commit ${GITHUB_SHA:0:7}._"
            echo ""
            .venv/bin/coverage report --format=markdown --ignore-errors
          } > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render terminal report (for the job log)
        run: .venv/bin/coverage report --ignore-errors

      - name: Generate HTML report
        run: .venv/bin/coverage html -d htmlcov --ignore-errors

      - name: Generate XML report
        run: .venv/bin/coverage xml -o coverage.xml --ignore-errors

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ github.run_id }}
          path: htmlcov/
          retention-days: 14

      - name: Upload combined XML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14

      - name: Install genbadge in an isolated venv
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv venv /tmp/badge-venv
          uv pip install --python /tmp/badge-venv/bin/python \
              'genbadge[coverage]'

      - name: Generate badge SVG
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: /tmp/badge-venv/bin/genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Push badge + report to badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp coverage-badge.svg /tmp/coverage-badge.svg
          cp coverage-report.md /tmp/coverage-report.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git checkout --orphan badges-tmp
          git rm -rf .
          cp /tmp/coverage-badge.svg coverage-badge.svg
          cp /tmp/coverage-report.md coverage-report.md
          git add coverage-badge.svg coverage-report.md
          git commit -m "Update coverage badge + report"
          git push origin badges-tmp:badges --force
