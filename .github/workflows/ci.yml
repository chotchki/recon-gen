# CI — collapsed onto a single self-hosted runner (CB.11.c, 2026-06-02).
#
# The pre-CB.11.c shape had six top-level jobs plus a sibling `e2e.yml`
# workflow with another four. With the self-hosted recon-gen-ci-local
# box online and `./run_tests.sh up_to=qs_browser` driving every layer
# (unit → db → app2 → deploy → qs_api → qs_browser) under one roof —
# Docker per-cell, AWS QuickSight deploys, Playwright WebKit, teardown —
# the matrix can collapse onto one self-hosted job.
#
# What stays out:
# - `e2e.yml` is deleted (the layered runner does its work). The nightly
#   AWS-sweep belongs in `nightly-cost-sweep.yml`, not here.
# - `release.yml` no longer re-runs tests; it gates on this workflow's
#   `workflow_run` success (see `release.yml.new`).
# - `docs-portable-install` stays on ubuntu-latest — it's a wheel-extras
#   gate, not a runner-layer concern.
# - `coverage-badge` stays on ubuntu-latest — pure post-processing.

name: CI

# Trigger model — only fire on:
#   - push: main          (post-merge gate)
#   - pull_request: main  (pre-merge gate)
#   - workflow_dispatch   (operator manual override)
# Feature-branch pushes intentionally do NOT fire CI; the self-hosted
# runner is a finite resource and PR-on-main is the contract.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Auto-cancel superseded runs on the same branch. A rapid follow-up push
# obsoletes the older commit's CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # AWS OIDC for the qs_api / qs_browser layers
  contents: read
  actions: read     # `gh run list` if any cleanup helper needs it

jobs:
  test-everything:
    name: Layered runner (unit → qs_browser)
    # v12.0.0 followup, preserved: skip the push-CI when this is a
    # Release commit. The Release workflow (release.yml) fires on the
    # tag push and runs its own pipeline; the parallel push-CI burns
    # AWS rate-limit budget contending with it. Downstream jobs
    # `needs: test-everything`, so skipping here skips everything.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')

    # The WSL2 Ubuntu runner on the 5800X3D / 64GB Windows box.
    # Playwright WebKit system deps, libatomic1, Docker, AWS CLI, and
    # uv are pre-installed (see BY.4 ops doc). recon-gen-ci-local is
    # the unique label tying jobs to this physical host.
    runs-on: [self-hosted, recon-gen-ci-local]

    # Hard cap so a hung Playwright session doesn't pin the runner.
    # 90 min is comfortable headroom over the observed ~50 min wall on
    # a full qs_browser sweep (BY.2 baseline).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (uv sync from uv.lock)
        # `--extra dev --extra prod` matches the broadest extras any
        # layer exercises (unit needs dev/pyright + playwright; db/app2
        # need prod for the seed + App2 server). Playwright + boto3-stubs
        # + pytest-xdist all live in [dev].
        run: uv sync --frozen --extra dev --extra prod

      - name: Install Playwright WebKit browser
        # WebKit system libs are pre-installed on the runner, so
        # --with-deps is omitted (it requires sudo). The browser binary
        # itself still needs per-version install.
        run: .venv/bin/playwright install webkit

      - name: Set up biome
        # biome is a standalone Rust binary; the pytest sessionstart
        # hook runs `biome check` as a gate when `biome` is on PATH.
        # Version pinned to match biome.jsonc schema.
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.14

      - name: Configure AWS credentials via OIDC
        # qs_api + qs_browser layers reach AWS for QuickSight deploys.
        # OIDC trust policy on `qs-gen-ci` role is documented in
        # `.github/E2E_SETUP.md` (carried over from e2e.yml).
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start shared PG + Oracle for aw-target cells
        # CB.14 followup (2026-06-03): the `aw` cells (sp_pg_aw / sq_pg_aw
        # / sp_or_aw / sq_or_aw) use the cfg's `demo_database_url`
        # directly (no per-cell container spin-up). Previously this
        # pointed at AWS RDS Aurora; CB.12 decommissioned that. Now CI
        # runs a shared PG + Oracle on the runner itself — distinct
        # ports from the per-cell `lo` containers
        # (lo uses 5433 / 1522 per `_LOCAL_PG_HOST_PORT` +
        # `_LOCAL_ORACLE_HOST_PORT`), so no collision.
        #
        # Postgres bound to host 5432 (PG default). Oracle bound to
        # host 1521 (Oracle default), using the locally-built
        # `recon-gen/oracle-19c:local` image with FREEPDB1 PDB +
        # alphanumeric password matching the runner's
        # `ORACLE_REUSE_PASSWORD`.
        run: |
          docker run -d --name ci-shared-pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:17-alpine
          docker run -d --name ci-shared-oracle \
            -e ORACLE_PWD=qsgentestpwd2026 \
            -e ORACLE_PDB=FREEPDB1 \
            -p 1521:1521 \
            recon-gen/oracle-19c:local
          # Wait for both to accept connections.
          echo "Waiting for shared PG..."
          timeout 60 bash -c 'until docker exec ci-shared-pg pg_isready -U postgres -q; do sleep 2; done'
          echo "Waiting for shared Oracle (pre-init'd image, ~15-30s)..."
          timeout 180 bash -c 'until docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; do sleep 3; done'
          echo "Shared DBs ready."

      - name: Materialize per-dialect runner cfgs
        # The runner discovers cfg via `run/config.<dialect>.yaml`.
        # For the AWS-touching layers it needs `auth:` (aws_profile or
        # quicksight_user_arn) + the QS account / region. We can't
        # depend on the runner box having these checked in (the whole
        # `run/` dir is gitignored), so the job materializes them from
        # secrets per-run.
        #
        # The AWS_ROLE_ARN step above already exported temporary creds
        # to the default profile, so the cfg's `auth:` block uses
        # `quicksight_user_arn` directly (no profile lookup needed).
        #
        # `demo_database_url` points at the shared containers from the
        # step above — 127.0.0.1:5432 (PG) + 127.0.0.1:1521 (Oracle).
        # For `lo` cells, the runner overrides this URL with
        # `127.0.0.1:<lo-container-port>` (5433 / 1522) at variant-seed
        # time; for `aw` cells, this cfg value is used directly.
        run: |
          mkdir -p run
          cat > run/config.postgres.yaml <<'EOF'
          aws_account_id: "470656905821"
          aws_region: "us-east-1"
          deployment_name: "qs-ci-${{ github.run_id }}-pg"
          db_table_prefix: "qs_ci_${{ github.run_id }}_pg"
          dialect: "postgres"
          demo_database_url: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
          principal_arns:
            - "${{ secrets.RECON_E2E_USER_ARN }}"
          auth:
            quicksight_user_arn: "${{ secrets.RECON_E2E_USER_ARN }}"
          EOF
          cat > run/config.oracle.yaml <<'EOF'
          aws_account_id: "470656905821"
          aws_region: "us-east-1"
          deployment_name: "qs-ci-${{ github.run_id }}-or"
          db_table_prefix: "qs_ci_${{ github.run_id }}_or"
          dialect: "oracle"
          demo_database_url: "oracle+oracledb://system:qsgentestpwd2026@127.0.0.1:1521/?service_name=FREEPDB1"
          principal_arns:
            - "${{ secrets.RECON_E2E_USER_ARN }}"
          auth:
            quicksight_user_arn: "${{ secrets.RECON_E2E_USER_ARN }}"
          EOF

      - name: Run the full layered chain (unit → qs_browser)
        # ./run_tests.sh is the canonical layered runner. up_to=qs_browser
        # invokes layers 1..6: unit (prelude, once) → db → app2 → deploy →
        # qs_api → qs_browser, fanned out across the matrix. --coverage
        # writes `.coverage.<variant>.<layer>` files into runs/<id>/.
        # Full default matrix (13 cells = sp/sq/fuzz × pg/or/du × lo/aw).
        # Lo cells spin per-cell containers via testcontainers; aw cells
        # use the shared PG + Oracle from the "Start shared..." step at
        # the top of the job. CB.15 (cells removal) is the longer-term
        # destination; this restores the default matrix in the meantime.
        #
        # RECON_GEN_E2E=1 lets the e2e-tier pytest collections run.
        # RECON_E2E_USER_ARN is consumed by the qs_browser layer for
        # embed URL minting (also derivable from cfg.auth, kept explicit
        # for parity with the legacy e2e.yml shape).
        env:
          RECON_GEN_E2E: "1"
          RECON_E2E_USER_ARN: ${{ secrets.RECON_E2E_USER_ARN }}
          # RECON_GEN_RUNNER_YES bypasses the destructive-op prompt; the
          # runner needs it in non-interactive CI. The legacy alias
          # QS_GEN_RUNNER_YES still works at runtime but leaks past
          # `monkeypatch.delenv(RECON_GEN_RUNNER_YES.name)` in the unit
          # tier's runner-flow tests, breaking those tests on CI even
          # though they pass locally.
          RECON_GEN_RUNNER_YES: "1"
        run: ./run_tests.sh up_to=qs_browser --coverage

      - name: Collect runner coverage data
        # Each layer wrote `.coverage.<variant>.<layer>` files under
        # `runs/<id>/<variant>/` (and `runs/<id>/_prelude/` for the unit
        # prelude). Flatten to repo root so the upload step's
        # `.coverage.*` glob catches them; the badge job's
        # `coverage combine` will merge them. Best-effort — never fail
        # the job over coverage collection.
        if: always()
        run: |
          find runs -name '.coverage.*' 2>/dev/null | while read -r f; do cp "$f" .; done || true
          echo "coverage data files: $(ls -la .coverage.* 2>/dev/null || echo '<none>')"

      - name: Upload runner artifacts (triage parity)
        # The `runs/<run-id>/` tree is the same artifact shape an
        # operator sees locally — per-variant per-layer cmd.json /
        # stdout.log / stderr.log / timings.json + screenshots from any
        # failing browser tests. The local `_dev/runner.py::collect_run_outputs`
        # already lays it out canonically.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload combined coverage data
        # Aggregator (coverage-badge job below) downloads this artifact.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-runner
          path: .coverage.*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Stop shared PG + Oracle containers
        # CB.14 followup — teardown for the shared containers from the
        # top of the job. Runs `if: always()` so the cleanup still fires
        # on test failure / runner cancellation.
        if: always()
        run: |
          docker stop ci-shared-pg ci-shared-oracle 2>/dev/null || true
          docker rm ci-shared-pg ci-shared-oracle 2>/dev/null || true

      - name: Sweep deployed QS resources (always)
        # Belt-and-suspenders: even though the runner's per-cell teardown
        # is supposed to be idempotent, a runner-killed-mid-job case
        # (timeout, OOM, manual cancel) leaves QS dashboards behind. The
        # `json clean` here scopes by `Deployment` tag — uses the same
        # deployment_name we wrote into the cfgs above, so it only
        # sweeps THIS run's resources.
        if: always()
        run: |
          mkdir -p /tmp/empty-out
          .venv/bin/recon-gen json clean -c run/config.postgres.yaml -o /tmp/empty-out --execute || true
          .venv/bin/recon-gen json clean -c run/config.oracle.yaml -o /tmp/empty-out --execute || true

  # Build a wheel from the current commit, install it in a fresh venv
  # (NOT an editable / src-tree install), and run `docs apply --portable`
  # end-to-end. Catches regressions where docs sourcing assumes a repo
  # checkout. Unchanged from pre-CB.11.c — pure wheel-extras gate.
  docs-portable-install:
    needs: test-everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel
        run: |
          uv pip install --system build
          python -m build --wheel --outdir /tmp/wheelhouse

      - name: Install wheel into a fresh venv (NOT editable)
        run: |
          uv venv /tmp/portable-test-venv
          uv pip install --python /tmp/portable-test-venv/bin/python \
              "$(ls /tmp/wheelhouse/recon_gen-*.whl)[prod]"

      - name: Build portable docs from installed wheel
        run: |
          /tmp/portable-test-venv/bin/recon-gen docs apply \
              --portable -o /tmp/portable-site
          test -f /tmp/portable-site/index.html
          test -f /tmp/portable-site/handbook/l1.html

      - name: Portable docs carry the L2 theme + site.css is persona-neutral (X.2.s.2)
        run: |
          set -e
          L2=/tmp/portable-site/stylesheets/_l2_theme.css
          SITE=/tmp/portable-site/stylesheets/site.css
          test -f "$L2" || { echo "::error::_l2_theme.css not generated — theming code didn't run"; exit 1; }
          grep -q -- '--qs-accent:' "$L2" || { echo "::error::_l2_theme.css doesn't set --qs-accent"; exit 1; }
          grep -qi '#2E5090' "$L2"        || { echo "::error::_l2_theme.css missing the bundled L2 accent"; exit 1; }
          grep -q 'stylesheets/_l2_theme.css' /tmp/portable-site/index.html || { echo "::error::index.html doesn't link _l2_theme.css"; exit 1; }
          grep -q 'var(--qs-accent)' "$SITE" || { echo "::error::site.css doesn't route through --qs-accent"; exit 1; }
          if grep -qi -- '--snb-\|2B4A2E' "$SITE"; then
            echo "::error::site.css still hard-codes the SNB palette (X.2.s.2 regression)"; exit 1
          fi

      - name: docs serve starts from installed wheel (X.2.s.1)
        run: |
          set +e
          cd /tmp  # ensure cwd has no docs/_macros — the failure cwd
          timeout 30 /tmp/portable-test-venv/bin/recon-gen docs serve \
              -p 8765 > /tmp/serve.log 2>&1
          set -e
          echo "--- docs serve output ---"; cat /tmp/serve.log
          if grep -qi "_macros.*does not exist\|does not exist.*_macros" /tmp/serve.log; then
            echo "::error::docs serve hit the X.2.s.1 macros-path regression"
            exit 1
          fi
          grep -qi "Serving on" /tmp/serve.log || {
            echo "::error::docs serve never reached 'Serving on'"
            exit 1
          }

  # Combine coverage data, render markdown + HTML reports, generate the
  # SVG badge, push to the `badges` branch. Merges the W.8b coverage job
  # and the prior coverage-badge job — there's only one source of
  # coverage data now (the runner), so the two-step indirection is gone.
  coverage-badge:
    name: Combine coverage + push badge
    needs: test-everything
    # Only push the badge on main pushes — PRs and dispatches still
    # render the report (Step Summary + artifacts) but skip the push.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (just coverage tooling)
        run: uv sync --frozen --extra dev

      - name: Download runner coverage data
        uses: actions/download-artifact@v6
        with:
          name: coverage-data-runner

      - name: Combine coverage data files
        run: .venv/bin/coverage combine

      - name: Render markdown report (Step Summary + artifact)
        run: |
          {
            echo "# Coverage report"
            echo ""
            echo "_Generated by CB.11.c collapsed CI on commit ${GITHUB_SHA:0:7}._"
            echo ""
            .venv/bin/coverage report --format=markdown
          } > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render terminal report (for the job log)
        run: .venv/bin/coverage report

      - name: Generate HTML report
        run: .venv/bin/coverage html -d htmlcov

      - name: Generate XML report
        run: .venv/bin/coverage xml -o coverage.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ github.run_id }}
          path: htmlcov/
          retention-days: 14

      - name: Upload combined XML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14

      - name: Install genbadge in an isolated venv
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv venv /tmp/badge-venv
          uv pip install --python /tmp/badge-venv/bin/python \
              'genbadge[coverage]'

      - name: Generate badge SVG
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: /tmp/badge-venv/bin/genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Push badge + report to badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp coverage-badge.svg /tmp/coverage-badge.svg
          cp coverage-report.md /tmp/coverage-report.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git checkout --orphan badges-tmp
          git rm -rf .
          cp /tmp/coverage-badge.svg coverage-badge.svg
          cp /tmp/coverage-report.md coverage-report.md
          git add coverage-badge.svg coverage-report.md
          git commit -m "Update coverage badge + report"
          git push origin badges-tmp:badges --force
