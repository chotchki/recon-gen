# CI — GitHub-hosted cloud runner (EA.4, 2026-07-04). Reverts the
# CB.11.c/CB.17.f collapse onto the self-hosted WSL2 box. That box only
# ever existed to reach QuickSight in us-east-1 over the hotchkiss.io
# DDNS forwards, and QuickSight + the whole AWS footprint are gone (Phase
# DW, v16). With nothing tying CI to a physical host, the layered runner
# moves back to `ubuntu-latest` — proven green by the EA.2 cloud spike
# (full unit → agreement chain, PG + Oracle + DuckDB, ~28 min wall,
# ~3.7 GB peak RSS on the 4-core/16 GB runner). Rationale:
# docs/audits/ea_1_self_hosted_rationale.md.
#
# What the flip changes vs the box (all ported from the EA.2 spike):
# - Fresh-ephemeral containers per run — a `postgres:17-alpine` + a
#   `gvenzl/oracle-free:23-faststart` (the box's un-pullable
#   `oracle-19c:local` is replaced by gvenzl, which `_resolve_oracle_image`
#   already auto-falls-back to). No flock / adopt / rename / reuse dance:
#   the VM is discarded at job end, so there are no persistent containers
#   to coordinate — and no per-run password force-reset, since a fresh
#   container gets this run's random password at init.
# - Self-signed TLS instead of ACME-via-Cloudflare: `RECON_GEN_TLS_SELF_SIGNED`
#   mints the cert for the locked CI SANs, certifi-append is the load-bearing
#   trust step, and /etc/hosts maps the SAN to loopback. No CLOUDFLARE_TOKEN —
#   its absence makes any accidental ACME fall-through fail loud.
# - `--with-deps webkit` + an apt-get for GNU time + graphviz, the two tools
#   the box pre-baked.
#
# What stays out:
# - `release.yml` no longer re-runs tests; it gates on this workflow's
#   `workflow_run` success — its `wait-for-ci` job polls the CI run on the
#   tagged SHA and clears the publish pipeline on success/skipped.
# - `docs-portable-install` / `clean-install-smoke` / `coverage-badge` were
#   already on ubuntu-latest — pure wheel-extras / post-processing gates,
#   untouched by the flip.

name: CI

# Trigger model — only fire on:
#   - push: main          (post-merge gate)
#   - pull_request: main  (pre-merge gate)
#   - workflow_dispatch   (operator manual override)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Auto-cancel superseded runs on the same branch. A rapid follow-up push
# obsoletes the older commit's CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read     # `gh run list` if any cleanup helper needs it

jobs:
  test-everything:
    name: Layered runner (unit → agreement)
    # Skip the push-CI on a Release commit: the Release workflow
    # (release.yml) fires on the tag push and runs its own gated pipeline,
    # and its `wait-for-ci` treats this job's `skipped` conclusion as the
    # deliberate green (the last pre-Release CI on main was already green
    # for the operator to cut the tag). Downstream jobs `needs:
    # test-everything`, so skipping here skips the whole CI run.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v')

    runs-on: ubuntu-latest

    # Hard cap so a hung Playwright session doesn't pin a runner. 90 min is
    # comfortable headroom over the EA.2 spike's ~28 min cloud wall.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # uv downloads python-build-standalone for whatever .python-version
        # pins (default `python-preference = managed`), so it doesn't depend
        # on the runner's OS-baked Python.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (uv sync from uv.lock)
        # `--extra dev --extra prod` covers what the layers exercise (unit
        # needs dev/pyright + playwright; db/app2 need prod for the seed +
        # App2 server). No `--extra quicksight` — QuickSight + boto3 are gone
        # (DW). Playwright + pytest-xdist live in [dev].
        run: uv sync --frozen --extra dev --extra prod

      - name: Install Playwright WebKit browser (+ system deps)
        # --with-deps because a fresh ubuntu-latest has none of the WebKit
        # system libs the WSL2 box pre-baked; sudo works on hosted runners.
        run: .venv/bin/playwright install --with-deps webkit

      - name: Set up biome
        # biome is a standalone Rust binary; the pytest sessionstart hook
        # runs `biome check` as a gate when `biome` is on PATH. Version
        # pinned to match the biome.jsonc schema.
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.14

      - name: Install system tools the box pre-baked (GNU time + graphviz)
        # ubuntu-latest lacks two tools the WSL2 box had pre-installed:
        #   - GNU /usr/bin/time (only the bash `time` builtin ships) — needed
        #     for the peak-RSS capture below.
        #   - graphviz `dot` — a TEST-only dep: test_cf3_diagram_regression
        #     cross-checks the wasm-graphviz product renderer against system
        #     `dot`. The product itself uses @hpcc-js/wasm-graphviz, so this
        #     is a CI-parity dep, not a runtime one.
        run: sudo apt-get update && sudo apt-get install -y time graphviz

      - name: Generate random DB passwords
        # `openssl rand -hex 14` = 28 alphanumeric chars — clears Oracle's
        # letter+digit+8char rule and fits its 30-byte quoted-identifier
        # limit (CE.4-followup: -hex 16 = 32 chars tripped ORA-00972).
        # `::add-mask::` redacts the value from every subsequent log frame.
        run: |
          PG_PASSWORD=$(openssl rand -hex 14)
          ORACLE_PASSWORD=$(openssl rand -hex 14)
          echo "::add-mask::${PG_PASSWORD}"
          echo "::add-mask::${ORACLE_PASSWORD}"
          {
            echo "PG_PASSWORD=${PG_PASSWORD}"
            echo "ORACLE_PASSWORD=${ORACLE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Generate random OIDC credentials
        # Per-run random secrets for the Dex OIDC client + test user + the
        # App2 JWT signing key; the runner's _ensure_oidc_if_configured reads
        # them via the typed RECON_GEN_OIDC_CLIENT_SECRET / RECON_GEN_JWT_SECRET
        # / RECON_GEN_DEX_USER_PASSWORD registry.
        run: |
          OIDC_CLIENT_SECRET=$(openssl rand -hex 14)
          JWT_SECRET=$(openssl rand -hex 32)
          DEX_USER_PASSWORD=$(openssl rand -hex 14)
          echo "::add-mask::${OIDC_CLIENT_SECRET}"
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${DEX_USER_PASSWORD}"
          {
            echo "RECON_GEN_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}"
            echo "RECON_GEN_JWT_SECRET=${JWT_SECRET}"
            echo "RECON_GEN_DEX_USER_PASSWORD=${DEX_USER_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Spin a FRESH Postgres container
        # No flock / adopt / rename / reuse (the box's persistent-container
        # dance) — the VM is discarded at job end. The tuning mirrors
        # `runner.py::_start_fresh_pg_container` (which local dev uses) so
        # CI ≡ local under xdist -n 4: max_connections=300 keeps
        # app2_browser off "too many clients", --shm-size=2g + effective
        # /dev/shm avoids "could not resize shared memory segment" on
        # concurrent matview refreshes, pg_stat_statements feeds the
        # top-queries capture below.
        run: |
          docker run -d --name ci-shared-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD="${PG_PASSWORD}" --shm-size=2g \
            postgres:17-alpine \
            -c max_connections=300 \
            -c shared_buffers=1GB \
            -c work_mem=32MB \
            -c maintenance_work_mem=256MB \
            -c effective_cache_size=4GB \
            -c synchronous_commit=off \
            -c shared_preload_libraries=pg_stat_statements
          echo "Waiting for Postgres..."
          timeout 60 bash -c 'until docker exec ci-shared-pg pg_isready -U postgres -q; do sleep 2; done'

      - name: Spin a FRESH Oracle container (gvenzl faststart)
        # gvenzl/oracle-free:23-faststart is pullable + multi-arch (the box's
        # oracle-19c:local is un-pullable). ORACLE_PASSWORD sets the system
        # password at init; it exposes service FREEPDB1 matching the cfg URL.
        # Readiness = gvenzl's "DATABASE IS READY TO USE" log marker (Docker's
        # HEALTHCHECK status stays empty — the EA.2 v1 timeout). Detect a
        # crashed container early + dump logs on any failure so a red Oracle
        # is diagnosable.
        run: |
          docker run -d --name ci-shared-oracle -p 1521:1521 \
            -e ORACLE_PASSWORD="${ORACLE_PASSWORD}" \
            gvenzl/oracle-free:23-faststart
          echo "Waiting for Oracle 'DATABASE IS READY TO USE'..."
          for _ in $(seq 1 180); do
            if docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle ready."; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ci-shared-oracle 2>/dev/null)" != "true" ]; then
              echo "::error::Oracle container is not running — logs:"; docker logs ci-shared-oracle 2>&1 | tail -60; exit 1
            fi
            sleep 5
          done
          if ! docker logs ci-shared-oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
            echo "::error::Oracle never became ready (15 min) — logs:"; docker logs ci-shared-oracle 2>&1 | tail -60; exit 1
          fi

      - name: Pre-generate the self-signed TLS cert + trust it
        # Mint the self-signed cert for the CI SANs BEFORE the chain (via the
        # RECON_GEN_TLS_SELF_SIGNED branch in _dev/tls/ensure.py) so the
        # runner's own ensure_dev_env finds it already-valid. httpx trusts
        # certifi's bundle (NOT SSL_CERT_FILE), so APPEND the cert to certifi
        # — the load-bearing trust step for the server-side authlib/Dex-
        # readiness HTTPS calls. SSL_CERT_FILE is belt-and-suspenders for any
        # stdlib-ssl consumer.
        run: |
          CERT_DIR="$HOME/.local/share/recon-gen/tls/ci"
          mkdir -p "$CERT_DIR"
          RECON_GEN_TLS_SELF_SIGNED=1 .venv/bin/python - <<'PY'
          from pathlib import Path
          from recon_gen._dev.tls.ensure import ensure_dev_env, Env
          d = Path.home() / ".local/share/recon-gen/tls/ci"
          ensure_dev_env(
              Env.CI, cert_path=d / "cert.pem", key_path=d / "key.pem",
              account_email="ci@localhost",
          )
          print("self-signed cert minted at", d)
          PY
          CERTIFI="$(.venv/bin/python -c 'import certifi; print(certifi.where())')"
          cat "$CERT_DIR/cert.pem" >> "$CERTIFI"
          echo "SSL_CERT_FILE=${CERTIFI}" >> "$GITHUB_ENV"
          echo "Appended self-signed cert to ${CERTIFI}"

      - name: Map the CI hostname to loopback (PRIMARY)
        # The locked issuer/redirect SAN resolves to the local Dex + App2.
        run: echo "127.0.0.1 localci.recon-gen.hotchkiss.io ci.recon-gen.hotchkiss.io" | sudo tee -a /etc/hosts

      - name: Materialize per-dialect runner cfgs (one cfg per dialect)
        # QuickSight removed (DW.11): no `aws:` block. CI needs the local DB
        # cfg + App2's own Dex OIDC / session / self-signed-TLS blocks
        # (AWS-independent). Both cfgs point db.url at the fresh containers
        # above; the env-URL short-circuit on the run step
        # (RECON_GEN_DEMO_DATABASE_URL_PG / _OR) tells the runner not to
        # re-spin its own. Heredoc UNquoted so ${PG_PASSWORD} /
        # ${ORACLE_PASSWORD} expand; ${{ github.run_id }} is GitHub template
        # syntax substituted by the runner before the shell sees it.
        # table_prefix uses the `rc_` base, not the box's `recon_ci_` — the
        # latter sits AT the 30-char cap once the isolation suffix is added
        # (EA.2 v6 fix).
        run: |
          mkdir -p run
          cat > run/config.postgres.yaml <<EOF
          db:
            dialect: "postgres"
            url: "postgresql://postgres:${PG_PASSWORD}@127.0.0.1:5432/postgres"
            table_prefix: "rc_${{ github.run_id }}_pg"
            default_l2_instance: "tests/l2/sasquatch_pr.yaml"
          auth:
            oidc:
              issuer_url: "https://localci.recon-gen.hotchkiss.io:5556/dex"
              client_id: "recon-gen-app2-test"
              client_secret_env: "RECON_GEN_OIDC_CLIENT_SECRET"
              redirect_uri: "https://localci.recon-gen.hotchkiss.io:8765/auth/callback"
              scopes:
                - "openid"
                - "email"
                - "profile"
            session:
              jwt_secret_env: "RECON_GEN_JWT_SECRET"
          app2:
            tls:
              cert_path: "~/.local/share/recon-gen/tls/ci/cert.pem"
              key_path: "~/.local/share/recon-gen/tls/ci/key.pem"
              account_email: "ci@localhost"
              env: "ci"
          EOF
          cat > run/config.oracle.yaml <<EOF
          db:
            dialect: "oracle"
            url: "oracle+oracledb://system:${ORACLE_PASSWORD}@127.0.0.1:1521/?service_name=FREEPDB1"
            table_prefix: "rc_${{ github.run_id }}_or"
            default_l2_instance: "tests/l2/sasquatch_pr.yaml"
          auth:
            oidc:
              issuer_url: "https://localci.recon-gen.hotchkiss.io:5556/dex"
              client_id: "recon-gen-app2-test"
              client_secret_env: "RECON_GEN_OIDC_CLIENT_SECRET"
              redirect_uri: "https://localci.recon-gen.hotchkiss.io:8765/auth/callback"
              scopes:
                - "openid"
                - "email"
                - "profile"
            session:
              jwt_secret_env: "RECON_GEN_JWT_SECRET"
          app2:
            tls:
              cert_path: "~/.local/share/recon-gen/tls/ci/cert.pem"
              key_path: "~/.local/share/recon-gen/tls/ci/key.pem"
              account_email: "ci@localhost"
              env: "ci"
          EOF

      - name: Run the full layered chain (unit → agreement)
        # ./run_tests.sh up_to=agreement invokes unit → db → app2 →
        # app2_browser → agreement, ONE pytest invocation per layer, fully
        # local (no AWS tier). `agreement` is the terminal cross-renderer
        # cross-check. --coverage writes `.coverage.<run-id>.<layer>` files
        # into runs/<id>/. The RECON_GEN_DEMO_DATABASE_URL_PG / _OR env vars
        # point every layer + seed subprocess at the fresh containers (the
        # CB.17.f short-circuit in `_start_thin_container` honors them and
        # returns immediately — no testcontainers spin).
        env:
          # Self-signed instead of ACME (NO CLOUDFLARE_TOKEN — the self-signed
          # branch never calls Cloudflare, and its absence makes any accidental
          # fall-through fail loud rather than silently mint).
          RECON_GEN_TLS_SELF_SIGNED: "1"
          RECON_GEN_BROWSER_INSECURE_TLS: "1"
          RECON_GEN_DEMO_DATABASE_URL_PG: "postgresql://postgres:${{ env.PG_PASSWORD }}@127.0.0.1:5432/postgres"
          RECON_GEN_DEMO_DATABASE_URL_OR: "oracle+oracledb://system:${{ env.ORACLE_PASSWORD }}@127.0.0.1:1521/?service_name=FREEPDB1"
          # RECON_GEN_RUNNER_YES bypasses the destructive-op prompt; the
          # runner needs it in non-interactive CI.
          RECON_GEN_RUNNER_YES: "1"
          # CE.4 trainer-hang re-pin (EA.3-confirmed): un-pinning to du,pg,or
          # hangs the app2 layer for ~40 min in
          # _studio_deploy_helpers.py:_run_server — the SAME CE.4 hang the box
          # hits, and it REPRODUCES on fresh cloud containers, so it's a
          # genuine PG/Oracle trainer-studio-server bug (backlog), not a
          # persistent-container-state artifact. Pin to du to match the box's
          # operator-locked workaround; cloud CI is no stricter than the box
          # until that bug is fixed.
          RECON_GEN_TRAINER_DIALECTS: "du"
        # Wrap the chain in /usr/bin/time -v to record peak RSS (Maximum
        # resident set size) — lands at the end of the step log and in the
        # runs/ artifact for drift tracking ([[feedback_timings_as_smell]]).
        run: |
          mkdir -p runs
          /usr/bin/time -v -o runs/peak-rss-time.log \
            ./run_tests.sh up_to=agreement --coverage
          echo "--- /usr/bin/time -v summary ---"
          cat runs/peak-rss-time.log
          echo "--- peak RSS ---"
          grep "Maximum resident set size" runs/peak-rss-time.log || true

      - name: Upload runner artifacts (triage parity)
        # The `runs/<run-id>/` tree is the same artifact shape an operator
        # sees locally — per-variant per-layer cmd.json / stdout.log /
        # stderr.log / timings.json + screenshots from any failing browser
        # tests. `_dev/runner.py::collect_run_outputs` lays it out canonically.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-runs-${{ github.run_id }}
          path: runs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage data files
        # CB.17.g: per-layer `.coverage.<layer>` files land directly at cwd
        # (REPO_ROOT) — the runner's COVERAGE_FILE override sets them there.
        # The aggregator job downloads this artifact and runs `coverage
        # combine`.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-runner
          path: .coverage.*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Surface top-queries in Step Summary + upload as artifact
        # CB.17.k — the `capture_top_queries` teardown writes
        # `runs/<id>/db/<dialect>/top-queries.md` with pg_stat_statements /
        # v$sqlstats top-50 for each dialect the session touched. Render them
        # inline in the GitHub Step Summary (same UX as the coverage report)
        # AND upload as a focused artifact so it's downloadable without
        # grabbing the full multi-GB runs/ tree.
        if: always()
        run: |
          {
            echo "# Top expensive queries"
            echo ""
            echo "_From \`capture_top_queries\` session-teardown; "
            echo "filter LIKE matches the cfg's \`db_table_prefix\`._"
            echo ""
            for f in $(find runs -name "top-queries.md" 2>/dev/null | sort); do
              echo ""
              echo "---"
              echo ""
              echo "<sub>${f}</sub>"
              echo ""
              cat "$f"
            done
          } > top-queries-summary.md
          if [ -s top-queries-summary.md ]; then
            cat top-queries-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No top-queries.md files found in runs/. " \
              "Either no DB-touching test layer fired, " \
              "or capture_top_queries hit its skip path." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload top-queries artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: top-queries-${{ github.run_id }}
          path: |
            top-queries-summary.md
            runs/*/db/*/top-queries.md
          if-no-files-found: warn
          retention-days: 30

      - name: Teardown fresh containers
        # The VM is discarded at job end, but tear down explicitly so a
        # mid-job failure can't strand a container in a cached runner image
        # layer. recon-gen-test-dex is the runner-spawned OIDC IdP.
        if: always()
        run: docker rm -f ci-shared-pg ci-shared-oracle recon-gen-test-dex || true

  # Build a wheel from the current commit, install it in a fresh venv
  # (NOT an editable / src-tree install), and run `docs apply --portable`
  # end-to-end. Catches regressions where docs sourcing assumes a repo
  # checkout. Unchanged from pre-CB.11.c — pure wheel-extras gate.
  docs-portable-install:
    needs: test-everything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # uv downloads python-build-standalone for whatever .python-version
        # pins (default `python-preference = managed`), independent of the
        # runner's OS-baked Python.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build wheel
        # `uv build` uses uv's managed Python automatically (no
        # `actions/setup-python` step → no system Python to install
        # `build` against). Replaces the prior
        # `uv pip install --system build && python -m build` shape
        # which broke when we dropped setup-python on 2026-06-05.
        run: uv build --wheel --out-dir /tmp/wheelhouse

      - name: Install wheel into a fresh venv (NOT editable)
        run: |
          uv venv /tmp/portable-test-venv
          uv pip install --python /tmp/portable-test-venv/bin/python \
              "$(ls /tmp/wheelhouse/recon_gen-*.whl)[prod]"

      - name: Build portable docs from installed wheel
        run: |
          /tmp/portable-test-venv/bin/recon-gen docs apply \
              --portable -o /tmp/portable-site
          test -f /tmp/portable-site/index.html
          test -f /tmp/portable-site/handbook/l1.html

      - name: Portable docs carry the L2 theme + site.css is persona-neutral (X.2.s.2)
        run: |
          set -e
          L2=/tmp/portable-site/stylesheets/_l2_theme.css
          SITE=/tmp/portable-site/stylesheets/site.css
          test -f "$L2" || { echo "::error::_l2_theme.css not generated — theming code didn't run"; exit 1; }
          grep -q -- '--qs-accent:' "$L2" || { echo "::error::_l2_theme.css doesn't set --qs-accent"; exit 1; }
          grep -qi '#2E5090' "$L2"        || { echo "::error::_l2_theme.css missing the bundled L2 accent"; exit 1; }
          grep -q 'stylesheets/_l2_theme.css' /tmp/portable-site/index.html || { echo "::error::index.html doesn't link _l2_theme.css"; exit 1; }
          grep -q 'var(--qs-accent)' "$SITE" || { echo "::error::site.css doesn't route through --qs-accent"; exit 1; }
          if grep -qi -- '--snb-\|2B4A2E' "$SITE"; then
            echo "::error::site.css still hard-codes the SNB palette (X.2.s.2 regression)"; exit 1
          fi

      - name: docs serve starts from installed wheel (X.2.s.1)
        run: |
          set +e
          cd /tmp  # ensure cwd has no docs/_macros — the failure cwd
          timeout 30 /tmp/portable-test-venv/bin/recon-gen docs serve \
              -p 8765 > /tmp/serve.log 2>&1
          set -e
          echo "--- docs serve output ---"; cat /tmp/serve.log
          if grep -qi "_macros.*does not exist\|does not exist.*_macros" /tmp/serve.log; then
            echo "::error::docs serve hit the X.2.s.1 macros-path regression"
            exit 1
          fi
          grep -qi "Serving on" /tmp/serve.log || {
            echo "::error::docs serve never reached 'Serving on'"
            exit 1
          }

  # DW.11 — clean-install smoke on stock ubuntu. QuickSight is gone, so
  # this is no longer the DV.10 "QS-is-optional" regression — it's the
  # permanent guard that the published surface installs + imports clean
  # with ZERO boto3 anywhere in the dependency graph (the runtime
  # complement to DW.14's no-boto3 AST lint).
  clean-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (Python 3.14 per .python-version)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install [dev] + [prod]
        run: uv sync --frozen --extra dev --extra prod

      - name: Prove boto3 is absent + the package imports clean
        run: |
          set -e
          .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('boto3') is None, 'boto3 leaked into the install'; print('boto3 absent: OK')"
          .venv/bin/python -c "import recon_gen, recon_gen.cli, recon_gen.common.config, recon_gen.apps.l1_dashboard.app, recon_gen.common.html.render; print('package + CLI + app + App2 renderer import clean: OK')"

      - name: A representative test slice passes
        run: .venv/bin/python -m pytest tests/unit/test_models.py tests/unit/test_theme_presets.py tests/unit/test_typing_smells.py -q -p no:cacheprovider

  # Combine coverage data, render markdown + HTML reports, generate the
  # SVG badge, push to the `badges` branch. Merges the W.8b coverage job
  # and the prior coverage-badge job — there's only one source of
  # coverage data now (the runner), so the two-step indirection is gone.
  coverage-badge:
    name: Combine coverage + push badge
    needs: test-everything
    # Only push the badge on main pushes — PRs and dispatches still
    # render the report (Step Summary + artifacts) but skip the push.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv (also installs Python 3.14 per .python-version)
        # uv downloads python-build-standalone for whatever .python-version
        # pins (default `python-preference = managed`), independent of the
        # runner's OS-baked Python.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (just coverage tooling)
        run: uv sync --frozen --extra dev

      - name: Download runner coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data-runner

      - name: Combine coverage data files
        run: .venv/bin/coverage combine

      - name: Render markdown report (Step Summary + artifact)
        # `--ignore-errors` lets `coverage report` skip files it can't map to
        # source (missing-source entries in the combined data) instead of
        # exiting non-zero. CI-followup.3 (2026-06-10) added it for that;
        # DV.8 wrongly removed it as shim-only (DV.7 deleted the shim) — but
        # it's general, so it's restored here. A stray unmappable entry in the
        # combined coverage shouldn't red the build (the tests already passed).
        run: |
          {
            echo "# Coverage report"
            echo ""
            echo "_Generated by CB.11.c collapsed CI on commit ${GITHUB_SHA:0:7}._"
            echo ""
            .venv/bin/coverage report --format=markdown --ignore-errors
          } > coverage-report.md
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render terminal report (for the job log)
        run: .venv/bin/coverage report --ignore-errors

      - name: Generate HTML report
        run: .venv/bin/coverage html -d htmlcov --ignore-errors

      - name: Generate XML report
        run: .venv/bin/coverage xml -o coverage.xml --ignore-errors

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ github.run_id }}
          path: htmlcov/
          retention-days: 14

      - name: Upload combined XML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14

      - name: Install genbadge in an isolated venv
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv venv /tmp/badge-venv
          uv pip install --python /tmp/badge-venv/bin/python \
              'genbadge[coverage]'

      - name: Generate badge SVG
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: /tmp/badge-venv/bin/genbadge coverage -i coverage.xml -o coverage-badge.svg

      - name: Push badge + report to badges branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp coverage-badge.svg /tmp/coverage-badge.svg
          cp coverage-report.md /tmp/coverage-report.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git checkout --orphan badges-tmp
          git rm -rf .
          cp /tmp/coverage-badge.svg coverage-badge.svg
          cp /tmp/coverage-report.md coverage-report.md
          git add coverage-badge.svg coverage-report.md
          git commit -m "Update coverage badge + report"
          git push origin badges-tmp:badges --force
