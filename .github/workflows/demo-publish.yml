# AE.8 — Demo refresh trigger on release publish.
#
# Fires when a GitHub release is published (after release.yml's
# publish-pypi step lands the wheel on PyPI Production). Runs on the
# self-hosted Mac mini runner (label: mac-mini-demo) which invokes
# the local refresh script — same script the nightly 03:00 ET launchd
# job runs. Result: release-day refresh is immediate, not capped at
# 24h wait.
#
# Runner setup (AE.8 install steps):
#   1. As recon-demo on the Mac mini: install the GitHub Actions
#      runner per https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners
#   2. Register with label `mac-mini-demo` and tie to this repo only
#      (NOT org-wide — narrow blast radius).
#   3. Run as a launchd service so the runner survives reboots:
#      ./svc.sh install (provided by the runner package).
#
# Permissions: this workflow does NOT need write access to the repo.
# The runner pulls from PyPI directly; no git operations land back
# in the repo from the runner.

name: Demo publish

on:
  # CU.4-followup (2026-06-09): chain off the Release workflow
  # completion. The prior `release: published` trigger was a no-op —
  # GitHub silently suppresses workflow triggers from events created
  # via GITHUB_TOKEN (anti-loop safety), and release.yml's
  # softprops/action-gh-release uses GITHUB_TOKEN. The workflow_run
  # event has no such restriction. The job-level conclusion gate
  # below skips on Release failure so a busted publish doesn't kick
  # off a broken refresh.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Allow manual trigger from the Actions UI — useful for "I just
  # changed cfg.yaml; force a refresh without cutting a release".
  workflow_dispatch:

# No GITHUB_TOKEN scopes needed — the runner pulls from PyPI directly
# and writes nothing back to the repo (per header). Empty block = drop
# every default scope.
permissions: {}

jobs:
  refresh:
    # The self-hosted Mac mini runner. The label `mac-mini-demo` is
    # set on the runner registration; the additional `self-hosted`
    # label is automatic. Both labels required so this job never
    # falls back to a GitHub-hosted runner.
    runs-on: [self-hosted, mac-mini-demo]
    # Skip when the triggering Release workflow didn't succeed (we
    # only want to refresh on a known-good publish). workflow_dispatch
    # has no workflow_run context, so the second clause keeps manual
    # fires working.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Belt-and-suspenders: bail if the runner accidentally runs as
    # the wrong user. The refresh script is mode 0500 owned by
    # recon-demo; a wrong-user execution would fail anyway, but a
    # clean early abort beats opaque permission denial.
    steps:
      - name: Identify runner user
        run: |
          set -eu
          if [ "$(id -un)" != "recon-demo" ]; then
            echo "::error::expected to run as recon-demo, got $(id -un)"
            exit 2
          fi
          echo "runner user: $(id -un)"
          echo "hostname:    $(hostname)"
          echo "release tag: ${{ github.event.workflow_run.head_branch || 'manual' }}"

      - name: Wait for PyPI index propagation (CZ.1 — race fix for refresh-demos.sh pip upgrade)
        if: github.event_name == 'workflow_run'
        # On a release-success workflow_run trigger, PyPI's CDN can lag the
        # Trusted Publishing event by 30-120s. refresh-demos.sh's
        # `pip install --upgrade` would otherwise see the OLD version as
        # latest and silently no-op. Poll PyPI's /pypi/<pkg>/json for
        # info.version == <tag-strip-v> with 20s × 6 retries (2 min max).
        # Fail loud if PyPI never shows the version — the demos shouldn't
        # publish stale code.
        #
        # On workflow_dispatch (manual operator re-fire), we trust PyPI is
        # already propagated and skip the poll (the only reason to manually
        # fire is to recover from a missed earlier auto-fire).
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          EXPECTED="${RELEASE_TAG#v}"
          echo "Polling PyPI for recon-gen==${EXPECTED} (max 2 min)..."
          for i in 1 2 3 4 5 6; do
            ACTUAL=$(curl -fsSL https://pypi.org/pypi/recon-gen/json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo "")
            if [ "${ACTUAL}" = "${EXPECTED}" ]; then
              echo "PyPI shows ${EXPECTED} (attempt ${i}/6) — propagated."
              exit 0
            fi
            echo "Attempt ${i}/6: PyPI shows ${ACTUAL:-<error>}, expected ${EXPECTED}. Sleeping 20s..."
            sleep 20
          done
          echo "::error::PyPI never propagated to ${EXPECTED} after 2 min — refusing to refresh demos with stale package."
          exit 1

      - name: Fire the refresh wrapper
        # The wrapper handles pip install --upgrade + per-instance
        # rebuild + atomic swap + launchctl kickstart. Same script
        # the nightly launchd job runs at 03:00 ET; same exit-code
        # propagation (any sub-step failure aborts).
        run: /Users/recon-demo/bin/refresh-demos.sh

      - name: Health check both demos
        # After the refresh, hit each public URL via cloudflared and
        # confirm 200. ``curl --max-time`` so a hanging request
        # doesn't block CI for 5+ min on the runner.
        #
        # Retry-with-backoff: refresh-demos.sh ends with
        # SIGTERM-the-server + KeepAlive respawn; for sasquatch (which
        # runs Studio + full editor + diagram + every dashboard) the
        # cold-start can take 20-40s before uvicorn binds the port.
        # Up to 6 attempts × 10s = ~1 min ceiling per URL — plenty for
        # the cold start without blocking CI indefinitely.
        run: |
          set -eu
          for url in \
              https://recon-gen-spec.hotchkiss.io/dashboards/l1_dashboard/ \
              https://recon-gen-sasquatch.hotchkiss.io/dashboards/l1_dashboard/; do
            echo "==> probing $url"
            code=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --silent --location --output /dev/null --write-out "%{http_code}" --max-time 30 "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "    200 OK (attempt $attempt)"
                break
              fi
              echo "    attempt $attempt: HTTP $code; retrying in 10s..."
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code after 6 attempts (expected 200)"
              exit 1
            fi
          done
