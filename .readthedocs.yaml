# ReadTheDocs build config — API reference only.
#
# CB.14 followup (2026-06-03): split the docs surface. mkdocs builds
# the end-user / integrator site at GitHub Pages (`docs apply` flow,
# `src/recon_gen/mkdocs.yml`); RTD builds the Python API reference
# via Sphinx autodoc over the recon_gen package.
#
# Sphinx is the right tool for API docs: autosummary walks the module
# tree, napoleon parses our existing Google-style docstrings, and RTD
# hosts the result with full-text search at no cost.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_install:
      # Install the package itself so autodoc can import the modules
      # it documents. The [prod] extras get pulled because some API
      # surfaces (oracledb, psycopg) are imported lazily but still
      # need to resolve for the autosummary walk.
      - pip install -e .[prod]
      - pip install -r docs-sphinx/requirements.txt

sphinx:
  configuration: docs-sphinx/conf.py
  fail_on_warning: false

# Don't render PDF / EPUB — HTML only.
formats: []
